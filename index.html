<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>NEGOTIATION × MEMORY MASTER PRO</title>
<style>

:root{
  --bg:#000; --char:#0c0d10; --char2:#15171c; --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.22);
  --silver:#c7cbd3; --dim:#8b909b; --white:#f5f6f8;
  --blue:#2b7bff; --cyan:#5ad1ff; --violet:#8a5cff; --ok:#5ff0c4; --bad:#ff7a90; --warn:#ffd27a;
  --fs:1; --r:22px; --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09);
  --font:'Inter','Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --t1:calc(clamp(34px,6.4vmin,92px)*var(--fs));
  --t2:calc(clamp(24px,3.6vmin,50px)*var(--fs));
  --t3:calc(clamp(18px,2.3vmin,30px)*var(--fs));
  --tb:calc(clamp(15px,1.75vmin,22px)*var(--fs));
  --ts:calc(clamp(13px,1.45vmin,18px)*var(--fs));
}
body.theme-navy{--bg:#02040c; --char:#070b18; --char2:#0d1326}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--white);font-family:var(--font);overflow:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-size:var(--tb);line-height:1.55;letter-spacing:-.01em;
  overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
input,textarea,select{user-select:text;-webkit-user-select:text}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#actors{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible}
#app{position:fixed;inset:0;z-index:2}
button{font:inherit;color:inherit}

/* ---------- glass ---------- */
.glass{background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.035));
  border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 20px 60px -20px rgba(0,0,0,.8);
  backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);border-radius:var(--r)}
body.q0 .glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(22,24,30,.92)}

/* ---------- top bar ---------- */
#topbar{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:20;
  display:flex;align-items:center;gap:14px;padding:6px 8px 6px 16px;border-radius:999px;max-width:calc(100vw - 20px)}
.brand{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.18em;color:var(--silver);white-space:nowrap}
.brand b{font-weight:600}.brand i{color:var(--dim);font-style:normal}
.brand-dot{width:8px;height:8px;border-radius:50%;background:radial-gradient(circle,#fff,var(--cyan));box-shadow:0 0 10px var(--cyan)}
.modes{display:flex;background:rgba(0,0,0,.35);border-radius:999px;padding:3px}
.mode-btn{white-space:nowrap;border:0;background:transparent;padding:10px 18px;border-radius:999px;font-size:15px;font-weight:600;color:var(--dim);cursor:pointer;min-height:44px;transition:color .3s,background .3s}
.mode-btn.on{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.fs-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:rgba(255,255,255,.06);color:#fff;font-size:18px;cursor:pointer;flex:none}
.fs-btn[hidden]{display:none}
.scene-label{font-size:13px;color:var(--dim);padding:0 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:760px){.brand{display:none}.scene-label{display:none}}

.mode-view{position:absolute;inset:0;display:none}
.mode-view.on{display:block}

/* ---------- deck / camera ---------- */
.deck{position:absolute;inset:0;perspective:1600px;perspective-origin:50% 45%;overflow:hidden}
.panel{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform,opacity,filter;display:none}
.panel .pin{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:calc(max(10px,env(safe-area-inset-top)) + 78px) clamp(16px,4vw,72px) 110px}
#mm .panel .pin{padding-top:calc(max(10px,env(safe-area-inset-top)) + 138px)}
.wrap{max-width:1480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center}
.wrap.top{justify-content:flex-start}

.dots{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:8px 10px;border-radius:999px;z-index:15}
.dot{width:30px;height:30px;border:0;background:transparent;border-radius:50%;cursor:pointer;position:relative;padding:0}
.dot::after{content:'';position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.28);transform:translate(-50%,-50%);transition:all .35s cubic-bezier(.2,.9,.3,1.3)}
.dot.v::after{background:rgba(255,255,255,.55)}
.dot.on::after{width:22px;border-radius:6px;background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 12px rgba(90,209,255,.6)}
@media (max-width:620px){.dot{width:20px}}
.edge-hint{position:absolute;top:50%;transform:translateY(-50%);font-size:44px;color:rgba(255,255,255,.12);pointer-events:none;z-index:3;font-weight:200}
.edge-hint.left{left:10px}.edge-hint.right{right:10px}

/* ---------- typography ---------- */
.eyebrow{font-size:var(--ts);letter-spacing:.32em;text-transform:uppercase;color:var(--cyan);font-weight:600;margin:0 0 10px}
.h1{font-size:var(--t1);font-weight:800;letter-spacing:-.035em;line-height:1.02;margin:0}
.h2{font-size:var(--t2);font-weight:800;letter-spacing:-.03em;line-height:1.12;margin:0 0 12px}
.h3{font-size:var(--t3);font-weight:700;letter-spacing:-.02em;line-height:1.25;margin:0 0 8px}
.lead{font-size:calc(var(--tb)*1.12);color:var(--silver);max-width:62ch;margin:0 0 18px}
.muted{color:var(--dim)}.small{font-size:var(--ts)}
.grad{background:linear-gradient(100deg,#fff 10%,var(--cyan) 45%,var(--violet) 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hl{color:#fff;background:linear-gradient(transparent 62%,rgba(43,123,255,.45) 62%);padding:0 2px;border-radius:2px}
.kw{color:var(--cyan);font-weight:700}
.src{display:inline-block;font-size:11px;letter-spacing:.12em;padding:3px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--silver);vertical-align:middle;margin-right:6px;font-weight:600}
.src.orig{border-color:rgba(90,209,255,.55);color:var(--cyan)}
.src.gen{border-color:rgba(169,139,255,.55);color:#c9b6ff}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:999px;border:1px solid var(--line2);
  background:rgba(255,255,255,.07);color:#fff;font-weight:600;font-size:var(--tb);cursor:pointer;transition:transform .25s cubic-bezier(.2,.9,.3,1.4),background .25s,border-color .25s,box-shadow .25s;white-space:nowrap}
.btn:active{transform:scale(.95)}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.primary{background:linear-gradient(135deg,#3a8dff,#6a5cff);border-color:transparent;box-shadow:0 10px 30px -8px rgba(58,141,255,.7),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.ghost{background:transparent}
.btn.sm{min-height:44px;padding:0 16px;font-size:var(--ts)}
.btn.big{min-height:64px;padding:0 36px;font-size:calc(var(--tb)*1.15)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.danger{border-color:rgba(255,122,144,.5);color:#ffb3c0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.c{justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.05);font-weight:600;cursor:pointer;transition:all .3s;font-size:var(--ts)}
.chip.on{background:linear-gradient(135deg,rgba(58,141,255,.35),rgba(138,92,255,.35));border-color:rgba(130,170,255,.7);box-shadow:0 0 20px -4px rgba(90,160,255,.6)}
.chip.lock{opacity:.4}
.card{padding:clamp(16px,2.2vmin,28px);border-radius:var(--r)}
.grid{display:grid;gap:clamp(12px,1.6vmin,22px)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(16px,2.6vmin,40px);align-items:center}
@media (orientation:portrait),(max-width:900px){.split{grid-template-columns:1fr}.g3,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.g2,.g3,.g5{grid-template-columns:1fr}}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:rgba(255,255,255,.16)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;margin-top:-12px;background:radial-gradient(circle at 35% 30%,#fff,#cfd6e4);box-shadow:0 4px 14px rgba(0,0,0,.6),0 0 0 4px rgba(90,209,255,.18)}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:rgba(255,255,255,.16)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:0}
.field{width:100%;min-height:52px;padding:14px 16px;border-radius:16px;border:1px solid var(--line2);background:rgba(0,0,0,.35);color:#fff;font:inherit;font-size:var(--tb);outline:none;transition:border-color .2s,box-shadow .2s}
.field:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(90,209,255,.15)}
textarea.field{min-height:180px;resize:vertical;line-height:1.6}
select.field{appearance:none}
label.lab{display:block;font-size:var(--ts);color:var(--silver);margin:10px 0 6px;font-weight:600}
.meter{height:10px;border-radius:10px;background:rgba(255,255,255,.1);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--blue),var(--cyan));width:0;transition:width .9s cubic-bezier(.2,.9,.25,1)}
.meter.v>i{background:linear-gradient(90deg,var(--violet),#d3b8ff)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.badge.ok{color:var(--ok);border-color:rgba(95,240,196,.4)}.badge.bad{color:var(--bad);border-color:rgba(255,122,144,.4)}.badge.warn{color:var(--warn);border-color:rgba(255,210,122,.4)}
.sep{height:1px;background:var(--line);margin:16px 0}
.fb{border-radius:16px;padding:14px 16px;margin-top:12px;border:1px solid var(--line)}
.fb.ok{background:rgba(95,240,196,.08);border-color:rgba(95,240,196,.35)}
.fb.bad{background:rgba(255,122,144,.08);border-color:rgba(255,122,144,.35)}
.fb.info{background:rgba(90,209,255,.07);border-color:rgba(90,209,255,.3)}
.svgbox{width:100%;height:auto;display:block;overflow:visible}

/* ---------- scene 1 / 15 ---------- */
.intro{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.intro .hint{position:absolute;bottom:14%;font-size:var(--ts);letter-spacing:.4em;color:var(--dim);animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.25}}
.mega{font-size:calc(clamp(44px,10.5vmin,170px)*var(--fs));font-weight:800;letter-spacing:.04em;margin:0;line-height:1}
.mega span{display:inline-block;opacity:0;filter:blur(18px);transform:translateY(30px) scale(1.3);transition:opacity 1.1s ease,filter 1.2s ease,transform 1.4s cubic-bezier(.16,1,.3,1),letter-spacing 2s}
.title-on .mega span{opacity:1;filter:blur(0);transform:none}
.intro .sub,.intro .kick{opacity:0;transform:translateY(16px);transition:all 1.2s cubic-bezier(.16,1,.3,1) 1.1s}
.intro .kick{transition-delay:1.5s}
.title-on .sub,.title-on .kick{opacity:1;transform:none}
.intro .sub{font-size:var(--t3);color:var(--silver);margin-top:22px;font-weight:300;letter-spacing:.06em}
.intro .kick{font-size:var(--ts);letter-spacing:.5em;color:var(--dim);margin-top:14px}

/* ---------- scene common pieces ---------- */
.avatar{width:clamp(70px,10vmin,130px);aspect-ratio:1;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-weight:800;font-size:var(--t3);position:relative;background:rgba(255,255,255,.02)}
.avatar small{position:absolute;bottom:-28px;font-size:var(--ts);font-weight:600;color:var(--silver);white-space:nowrap}
.step-pills{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0}
.term-card{cursor:pointer;transition:transform .5s cubic-bezier(.2,.9,.3,1.2),box-shadow .4s,border-color .4s;position:relative;overflow:hidden}
.term-card:active{transform:scale(.97)}
.term-card .tc-name{font-size:var(--t3);font-weight:800}
.term-card .tc-more{max-height:0;overflow:hidden;opacity:0;transition:max-height .7s cubic-bezier(.2,.9,.2,1),opacity .5s}
.term-card.open{border-color:rgba(90,209,255,.55);box-shadow:0 0 40px -10px rgba(90,209,255,.5),inset 0 1px 0 rgba(255,255,255,.2)}
.term-card.open .tc-more{max-height:900px;opacity:1}
.term-card::before{content:'';position:absolute;inset:-1px;background:radial-gradient(400px circle at var(--mx,50%) var(--my,0%),rgba(90,209,255,.12),transparent 40%);pointer-events:none}

.zopa-status{font-size:var(--t3);font-weight:800}
.flip{perspective:1000px;cursor:pointer;min-height:190px}
.flip-in{position:relative;width:100%;height:100%;min-height:190px;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.9,.25,1.15)}
.flip.on .flip-in{transform:rotateY(180deg)}
.flip-f,.flip-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:18px;border-radius:var(--r);display:flex;flex-direction:column;justify-content:center}
.flip-b{transform:rotateY(180deg)}
.flip.best .flip-b{border-color:rgba(95,240,196,.6);box-shadow:0 0 40px -10px rgba(95,240,196,.5)}

.carousel{position:relative;height:clamp(260px,40vmin,440px);perspective:1200px;touch-action:pan-y}
.car-ring{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
.car-item{position:absolute;width:clamp(120px,17vmin,200px);height:clamp(150px,22vmin,250px);margin-left:calc(clamp(120px,17vmin,200px)/-2);margin-top:calc(clamp(150px,22vmin,250px)/-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;border-radius:28px;transition:border-color .4s,box-shadow .4s}
.car-item.on{border-color:rgba(90,209,255,.7);box-shadow:0 0 60px -10px rgba(90,209,255,.6)}
.car-item svg{width:62%;height:auto}
.car-item b{font-size:var(--tb)}

.chat{display:flex;flex-direction:column;gap:10px;max-height:38vh;overflow-y:auto;padding:4px}
.msg{max-width:84%;padding:12px 16px;border-radius:20px;line-height:1.5;animation:msgIn .55s cubic-bezier(.2,.9,.3,1.25)}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,rgba(58,141,255,.4),rgba(106,92,255,.35));border-bottom-right-radius:6px}
.msg.op{align-self:flex-start;background:rgba(255,255,255,.08);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.sys{align-self:center;font-size:var(--ts);color:var(--silver);background:rgba(90,209,255,.06);border:1px dashed rgba(90,209,255,.3);max-width:96%;text-align:center}
@keyframes msgIn{from{opacity:0;transform:translateY(14px) scale(.96)}}
.issue{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 180px;text-align:left;min-height:52px;padding:10px 14px;border-radius:16px;border:1px solid var(--line2);background:rgba(255,255,255,.04);cursor:pointer;font-size:var(--ts);transition:all .25s}
.seg button.on{border-color:var(--cyan);background:rgba(90,209,255,.12);box-shadow:0 0 0 3px rgba(90,209,255,.12)}
.seg button[disabled]{opacity:.35}

.opt{display:block;width:100%;text-align:left;min-height:58px;padding:14px 18px;border-radius:18px;border:1px solid var(--line2);background:rgba(255,255,255,.045);cursor:pointer;font-size:var(--tb);margin-bottom:10px;transition:all .3s cubic-bezier(.2,.9,.3,1.2)}
.opt:active{transform:scale(.98)}
.opt.ok{border-color:var(--ok);background:rgba(95,240,196,.12)}
.opt.bad{border-color:var(--bad);background:rgba(255,122,144,.1)}
.opt.dim{opacity:.45}

/* ---------- sheet / toast ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);animation:fadeIn .3s}
.sheet-wrap[hidden]{display:none}
.sheet{width:min(860px,100%);max-height:88vh;overflow-y:auto;padding:24px clamp(18px,3vw,36px) calc(24px + env(safe-area-inset-bottom));border-radius:30px 30px 0 0;animation:sheetUp .55s cubic-bezier(.16,1,.3,1)}
@media (min-height:700px) and (min-width:900px){.sheet-wrap{align-items:center}.sheet{border-radius:30px}}
@keyframes sheetUp{from{transform:translateY(60px) scale(.97);opacity:0}}
@keyframes fadeIn{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,30px);z-index:60;padding:14px 22px;border-radius:999px;background:rgba(20,22,28,.92);border:1px solid var(--line2);opacity:0;pointer-events:none;transition:all .45s cubic-bezier(.2,.9,.3,1.3);max-width:90vw;text-align:center;font-size:var(--ts)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- MM ---------- */
.mm-nav{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 70px);left:50%;transform:translateX(-50%);z-index:15;display:flex;gap:4px;padding:5px;border-radius:999px;max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}
.mm-nav::-webkit-scrollbar{display:none}
.mm-nav button{border:0;background:transparent;color:var(--dim);font-weight:600;padding:8px 14px;border-radius:999px;min-height:44px;white-space:nowrap;cursor:pointer;font-size:14px;transition:all .3s}
.mm-nav button.on{background:rgba(255,255,255,.14);color:#fff}
.mm-nav button .n{font-size:10px;opacity:.6;margin-right:4px;letter-spacing:.1em}
.stat{padding:16px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.stat b{display:block;font-size:var(--t3);font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:var(--ts);color:var(--dim)}
.stat .est{font-size:10px;color:#c9b6ff;letter-spacing:.1em}
.ring-wrap{position:relative;display:grid;place-items:center}
.ring-wrap .ring-t{position:absolute;text-align:center}
.ring-wrap .ring-t b{font-size:var(--t2);font-weight:800;display:block;line-height:1}
.ring-wrap .ring-t span{font-size:var(--ts);color:var(--dim)}
.clist{display:flex;flex-direction:column;gap:8px}
.citem{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid var(--line);cursor:pointer}
.citem .ct{flex:1;min-width:0}
.citem .ct b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem .ct span{font-size:var(--ts);color:var(--dim);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state-dot{width:12px;height:12px;border-radius:50%;flex:none;background:#2a2d35;border:1px solid #444}
.state-dot.learning{background:#3a6fb8;box-shadow:0 0 8px #3a6fb8}
.state-dot.verified{background:#bfefff;box-shadow:0 0 12px #7fd4ff}
.state-dot.review{background:transparent;border:2px solid var(--warn);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,210,122,0)}0%{box-shadow:0 0 0 0 rgba(255,210,122,.6)}}
.bubble{position:absolute;padding:12px 18px;border-radius:999px;font-weight:700;cursor:pointer;white-space:nowrap;min-height:48px;display:flex;align-items:center}
.arena{position:relative;height:min(46vh,420px);border-radius:24px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(ellipse at center,rgba(43,123,255,.08),transparent 70%)}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--cyan);color:transparent;margin:0 3px;text-align:center}
.blank.fill{color:var(--ok);animation:morphIn .7s cubic-bezier(.2,.9,.3,1.3)}
@keyframes morphIn{from{filter:blur(10px);transform:scale(1.6);opacity:0}}
.word{transition:opacity .6s,filter .6s}
.word.gone{opacity:0;filter:blur(8px)}
.ordcard{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line2);margin-bottom:8px;cursor:pointer;min-height:56px;transition:all .35s cubic-bezier(.2,.9,.3,1.25)}
.ordcard .num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(90,209,255,.15);color:var(--cyan);font-weight:800;flex:none}
.ordcard.picked{opacity:.35}
.mcard{padding:14px 16px;border-radius:16px;border:1px solid var(--line2);background:rgba(255,255,255,.05);cursor:pointer;margin-bottom:8px;min-height:56px;transition:all .3s;font-size:var(--ts)}

@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.tabbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

.big-num{font-size:calc(clamp(60px,12vmin,160px)*var(--fs));font-weight:800;letter-spacing:-.05em;line-height:1}
body.reduce *{animation-duration:.01s!important;transition-duration:.05s!important}
.table{width:100%;border-collapse:collapse;font-size:var(--ts)}

.table select{min-height:40px;padding:6px 10px;font-size:13px}

<body>

<script>
/* ---- js/core.js ---- */
/* ============ CORE: utils, springs, loop, quality, storage, camera, actors ============ */
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const fmtDate = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const dayKey = (t = Date.now()) => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const INTERACTIVE = 'button,a,input,textarea,select,label,[data-int],.opt,.chip,.term-card,.flip,.carousel,.mcard,.ordcard,.bubble,svg.int,.citem,.seg,.dots,#topbar,.mm-nav';

/* ---- physics spring (semi-implicit Euler with fixed substeps; time based) ---- */
class Spring {
  constructor(x = 0, k = 120, c = 18) { this.x = x; this.v = 0; this.t = x; this.k = k; this.c = c; }
  set(t) { this.t = t; return this; }
  snap(x) { this.x = this.t = x; this.v = 0; return this; }
  step(dt) {
    const km = this.k * (App.speedMul || 1), cm = this.c * Math.sqrt(App.speedMul || 1);
    const n = Math.max(1, Math.ceil(dt / (1 / 240))), h = dt / n;
    for (let i = 0; i < n; i++) { const a = -km * (this.x - this.t) - cm * this.v; this.v += a * h; this.x += this.v * h; }
    if (Math.abs(this.x - this.t) < 1e-4 && Math.abs(this.v) < 1e-4) { this.x = this.t; this.v = 0; }
    return this.x;
  }
  get idle() { return this.x === this.t && this.v === 0; }
}

/* ---- global app object ---- */
const App = { speedMul: 1, quality: 2, reduce: false, tickers: new Set(), mode: 'lesson', W: innerWidth, H: innerHeight };

/* ---- main loop with real elapsed time + adaptive quality ---- */
(function loop() {
  let last = performance.now(), acc = [], goodFor = 0;
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.1) dt = 0.1; // tab was hidden: don't jump states
    acc.push(dt); if (acc.length > 50) acc.shift();
    if (acc.length === 50) {
      const avg = acc.reduce((a, b) => a + b, 0) / 50;
      if (avg > 1 / 40 && App.quality > 0) { setQuality(App.quality - 1); acc = []; goodFor = 0; }
      else if (avg < 1 / 75) { goodFor += dt; if (goodFor > 4 && App.quality < App.maxQuality) { setQuality(App.quality + 1); goodFor = 0; acc = []; } }
    }
    App.tickers.forEach(f => { try { f(dt, now) } catch (e) { console.error(e); App.tickers.delete(f); } });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
App.maxQuality = 2;
function setQuality(q) { App.quality = q; document.body.classList.remove('q0', 'q1', 'q2'); document.body.classList.add('q' + q); BG && BG.resize(); }
addEventListener('resize', () => { App.W = innerWidth; App.H = innerHeight; BG && BG.resize(); });

/* ---- storage (localStorage, guarded) ---- */
const Store = {
  key: 'negoMM.v1', data: null,
  defaults() {
    return {
      v: 1, mode: 'lesson',
      lesson: { scene: 0, visited: {}, quiz: { answers: {}, firstTry: {} }, sim: null },
      mm: { current: null, materials: {}, view: 0, settings: {} }, days: {}
    };
  },
  load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(this.key) || 'null'); } catch (e) { d = null; }
    const base = this.defaults();
    if (!d || d.v !== 1) d = base;
    d.lesson = Object.assign(base.lesson, d.lesson || {});
    d.mm = Object.assign(base.mm, d.mm || {});
    d.days = d.days || {};
    this.data = d; return d;
  },
  _t: 0,
  save(now) {
    clearTimeout(this._t);
    const run = () => { try { localStorage.setItem(this.key, JSON.stringify(this.data)); this.ok = true; } catch (e) { this.ok = false; toast('저장 공간이 부족하거나 저장이 차단되어 기록을 저장하지 못했습니다.'); } };
    if (now) run(); else this._t = setTimeout(run, 350);
  }
};
addEventListener('pagehide', () => Store.save(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) Store.save(true); });

/* ---- feedback: toast, sheet, confirm, sound, vibration, speech ---- */
let _toastT;
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(_toastT); _toastT = setTimeout(() => t.classList.remove('on'), ms); }
function openSheet(html, mount) {
  const w = $('#sheet'), s = w.firstElementChild; s.innerHTML = html; w.hidden = false;
  w.onclick = e => { if (e.target === w || e.target.closest('[data-close]')) closeSheet(); };
  mount && mount(s); return s;
}
function closeSheet() { const w = $('#sheet'); w.hidden = true; w.firstElementChild.innerHTML = ''; }
function confirmBox(msg, ok = '확인', danger = true) {
  return new Promise(res => {
    openSheet(`<p class="h3">${esc(msg)}</p><div class="row" style="justify-content:flex-end;margin-top:20px"><button class="btn ghost" data-c="0">취소</button><button class="btn ${danger ? 'danger' : 'primary'}" data-c="1">${esc(ok)}</button></div>`, s => {
      s.addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (b) { closeSheet(); res(b.dataset.c === '1'); } });
    });
  });
}
const Fx = {
  ctx: null,
  beep(kind) {
    const st = Store.data && Store.data.mm.settings; if (!st || !st.sound) return;
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const c = this.ctx, o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination);
      const f = kind === 'ok' ? [660, 990] : kind === 'bad' ? [220, 160] : [520, 520];
      o.frequency.setValueAtTime(f[0], c.currentTime); o.frequency.exponentialRampToValueAtTime(f[1], c.currentTime + .16);
      g.gain.setValueAtTime(.0001, c.currentTime); g.gain.exponentialRampToValueAtTime(.12, c.currentTime + .02); g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + .28);
      o.start(); o.stop(c.currentTime + .3);
    } catch (e) { }
    if (navigator.vibrate) try { navigator.vibrate(kind === 'bad' ? [30, 40, 30] : 18); } catch (e) { }
  },
  ok() { this.beep('ok') }, bad() { this.beep('bad') }
};
function speak(text) {
  if (!('speechSynthesis' in window)) { toast('이 브라우저는 음성 읽기(SpeechSynthesis)를 지원하지 않습니다.'); return; }
  try {
    speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = /[가-힣]/.test(text) ? 'ko-KR' : 'en-US';
    u.rate = (Store.data.mm.settings.ttsRate || 1); speechSynthesis.speak(u);
  } catch (e) { toast('음성 읽기를 실행할 수 없습니다.'); }
}

/* ---- background: particles with parallax & soft nebula ---- */
const BG = {
  c: null, x: null, pts: [], par: 0, parV: 0, px: 0, py: 0, intensity: 1,
  init() {
    this.c = $('#bg'); this.x = this.c.getContext('2d'); this.resize();
    addEventListener('pointermove', e => { this.px = e.clientX / App.W - .5; this.py = e.clientY / App.H - .5; }, { passive: true });
    App.tickers.add((dt, t) => this.draw(dt, t));
  },
  resize() {
    if (!this.c) return;
    const dpr = Math.min(devicePixelRatio || 1, App.quality === 2 ? 1.5 : 1);
    this.dpr = dpr; this.c.width = App.W * dpr; this.c.height = App.H * dpr;
    const n = Math.round([28, 70, 130][App.quality] * this.intensity);
    this.pts = Array.from({ length: n }, () => ({ x: Math.random(), y: Math.random(), z: Math.random() * .9 + .1, s: Math.random() * 1.4 + .3, h: Math.random() }));
  },
  draw(dt, t) {
    const x = this.x, W = this.c.width, H = this.c.height, d = this.dpr; if (!x) return;
    x.clearRect(0, 0, W, H);
    if (this.intensity > 0 && App.quality > 0) {
      const tt = t / 1000, g1 = x.createRadialGradient(W * (.3 + Math.sin(tt * .05) * .05 - this.par * .02), H * .35, 0, W * .3, H * .35, W * .55);
      g1.addColorStop(0, `rgba(43,90,255,${.10 * this.intensity})`); g1.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = g1; x.fillRect(0, 0, W, H);
      const g2 = x.createRadialGradient(W * (.75 - this.par * .03), H * .7, 0, W * .75, H * .7, W * .5);
      g2.addColorStop(0, `rgba(138,92,255,${.08 * this.intensity})`); g2.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = g2; x.fillRect(0, 0, W, H);
    }
    const sp = this.parV;
    for (const p of this.pts) {
      p.y -= dt * .006 * p.z; if (p.y < -.05) p.y = 1.05;
      const px = ((p.x - this.par * .08 * p.z - this.px * .03 * p.z) % 1 + 1) % 1 * W, py = (p.y - this.py * .03 * p.z) * H;
      const a = (.25 + p.z * .55) * Math.min(1, this.intensity + .2);
      x.fillStyle = p.h > .8 ? `rgba(169,139,255,${a})` : p.h > .55 ? `rgba(90,209,255,${a})` : `rgba(220,225,235,${a * .8})`;
      const streak = Math.min(40, Math.abs(sp) * 30 * p.z) * d;
      if (streak > 2 && App.quality > 1) { x.fillRect(px - (sp > 0 ? 0 : streak), py, streak, p.s * d * .7); }
      else { x.beginPath(); x.arc(px, py, p.s * d * p.z, 0, 6.283); x.fill(); }
    }
  }
};

/* ---- camera deck: panels in 3D space, one spring camera (interruptible, velocity kept) ---- */
class CameraDeck {
  constructor(el, opt = {}) {
    this.el = el; this.cam = new Spring(0, 95, 17.5); this.panels = []; this.target = 0; this.opt = opt; this.lastActive = -1;
    App.tickers.add(dt => this.tick(dt));
  }
  setPanels(n, factory) {
    this.el.innerHTML = '';
    this.panels = Array.from({ length: n }, (_, i) => { const p = document.createElement('section'); p.className = 'panel'; p.dataset.i = i; p.innerHTML = '<div class="pin"></div>'; this.el.appendChild(p); return { el: p, pin: p.firstChild, mounted: false, i }; });
    this.factory = factory;
  }
  ensure(i) { const p = this.panels[i]; if (p && !p.mounted) { p.mounted = true; this.factory(i, p.pin, p); } return p; }
  go(i, instant) {
    i = clamp(i, 0, this.panels.length - 1);
    const prev = this.target; this.target = i; this.cam.set(i); if (instant) this.cam.snap(i);
    this.ensure(i); this.opt.onTarget && this.opt.onTarget(i, prev);
  }
  next() { this.go(this.target + 1) } prev() { this.go(this.target - 1) }
  tick(dt) {
    if (!this.el.offsetParent && this.el.closest('.mode-view') && !this.el.closest('.mode-view').classList.contains('on')) return;
    const x = this.cam.step(dt), v = this.cam.v, W = App.W, q = App.quality, red = App.reduce;
    if (this.opt.onCam) this.opt.onCam(x, v);
    for (const p of this.panels) {
      const d = p.i - x, ad = Math.abs(d);
      if (ad > 1.25) { if (p.vis) { p.el.style.display = 'none'; p.vis = false; } continue; }
      this.ensure(p.i);
      if (!p.vis) { p.el.style.display = 'block'; p.vis = true; }
      let tf;
      if (red) tf = `translate3d(${d * W * .15}px,0,0)`;
      else tf = `translate3d(${d * W * .58}px,${ad * 18}px,${-ad * 460}px) rotateY(${-d * 26}deg) scale(${1 - ad * .05})`;
      p.el.style.transform = tf;
      p.el.style.opacity = String(clamp(1 - ad * .95, 0, 1));
      const blur = (q > 1 && !red) ? Math.min(14, ad * 9 + Math.min(8, Math.abs(v) * 1.6)) : 0;
      p.el.style.filter = blur > .4 ? `blur(${blur.toFixed(1)}px)` : 'none';
      p.el.style.pointerEvents = ad < .45 ? 'auto' : 'none';
      p.el.style.zIndex = String(100 - Math.round(ad * 10));
    }
    const act = Math.round(x);
    if (act !== this.lastActive) { this.lastActive = act; this.opt.onActive && this.opt.onActive(act); }
  }
}

/* ---- tap navigation on non-interactive area (left = prev, right = next) ---- */
function attachTapNav(el, onTap) {
  const ptrs = new Map(); let multi = false;
  el.addEventListener('pointerdown', e => { ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, t: performance.now() }); if (ptrs.size > 1) multi = true; });
  const end = e => {
    const s = ptrs.get(e.pointerId); ptrs.delete(e.pointerId);
    if (!s) return; const wasMulti = multi; if (ptrs.size === 0) multi = false;
    if (wasMulti || e.type === 'pointercancel') return;
    if (Math.hypot(e.clientX - s.x, e.clientY - s.y) > 12 || performance.now() - s.t > 600) return;
    if (e.target.closest(INTERACTIVE)) return;
    if (!$('#sheet').hidden) return;
    const sel = window.getSelection && String(window.getSelection()); if (sel && sel.length > 1) return;
    onTap(e.clientX > App.W / 2 ? 1 : -1, e);
  };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}

/* ---- actors: two orbs + link line, morphing between scene targets ---- */
const Actors = {
  s: {}, provider: null, wob: 0,
  init() {
    const k = 70, c = 14;
    ['ax', 'ay', 'ar', 'bx', 'by', 'br', 'op', 'line', 'tension', 'merge'].forEach(n => this.s[n] = new Spring(0, k, c));
    this.s.ax.snap(App.W * .25); this.s.bx.snap(App.W * .75); this.s.ay.snap(App.H * .5); this.s.by.snap(App.H * .5); this.s.ar.snap(30); this.s.br.snap(30);
    this.el = { a: $('#actA'), b: $('#actB'), ha: $('#haloA'), hb: $('#haloB'), l: $('#actorLine'), svg: $('#actors') };
    App.tickers.add((dt, t) => this.tick(dt, t));
  },
  tick(dt, t) {
    const tg = this.provider ? this.provider() : { op: 0 };
    const s = this.s;
    for (const k in tg) if (s[k]) s[k].set(tg[k]);
    for (const k in s) s[k].step(dt);
    const e = this.el, op = clamp(s.op.x, 0, 1);
    e.svg.style.opacity = op; if (op < .01) return;
    const tt = t / 1000, ten = s.tension.x;
    const jx = Math.sin(tt * 1.7) * 6 * ten, jy = Math.cos(tt * 1.3) * 5 * ten;
    const ax = s.ax.x + jx, ay = s.ay.x + jy, bx = s.bx.x - jx, by = s.by.x - jy;
    const ar = Math.max(1, s.ar.x * (1 + Math.sin(tt * 2.1) * .03)), br = Math.max(1, s.br.x * (1 + Math.cos(tt * 2.3) * .03));
    e.a.setAttribute('cx', ax); e.a.setAttribute('cy', ay); e.a.setAttribute('r', ar);
    e.b.setAttribute('cx', bx); e.b.setAttribute('cy', by); e.b.setAttribute('r', br);
    e.ha.setAttribute('cx', ax); e.ha.setAttribute('cy', ay); e.ha.setAttribute('r', ar * 3.2);
    e.hb.setAttribute('cx', bx); e.hb.setAttribute('cy', by); e.hb.setAttribute('r', br * 3.2);
    const mx = (ax + bx) / 2, my = (ay + by) / 2, wob = Math.sin(tt * 9) * 14 * ten;
    e.l.setAttribute('d', `M${ax},${ay} Q${mx + wob * .3},${my + wob} ${bx},${by}`);
    e.l.style.opacity = clamp(s.line.x, 0, 1); e.l.setAttribute('stroke-width', 1 + s.merge.x * 3);
    e.l.style.filter = s.merge.x > .5 && App.quality > 0 ? 'drop-shadow(0 0 6px #5ad1ff)' : 'none';
  }
};
/* anchor helper: centre of element in viewport, or null */
function anchorOf(el) { if (!el) return null; const r = el.getBoundingClientRect(); if (!r.width) return null; return { x: r.left + r.width / 2, y: r.top + r.height / 2, r: Math.min(r.width, r.height) / 2 }; }

/* ---- pointer drag helper with capture ---- */
function drag(el, { start, move, end }) {
  el.addEventListener('pointerdown', e => {
    if (start && start(e) === false) return;
    e.preventDefault(); el.setPointerCapture && el.setPointerCapture(e.pointerId);
    const id = e.pointerId;

const Lesson = {
  deck: null, S: {},
  init() {
    const L = Store.data.lesson;
    this.deck = new CameraDeck($('#scenes'), {
      onTarget: (i) => { L.scene = i; L.visited[i] = 1; Store.save(); this.updateDots(); const sc = SCENES[i]; sc.enter && sc.enter(this.deck.panels[i].pin); },
      onCam: (x, v) => { if (App.mode === 'lesson') { BG.par = x; BG.parV = v; } }
    });
    this.deck.setPanels(SCENES.length, (i, pin) => SCENES[i].mount(pin));
    const dots = $('#dots'); dots.innerHTML = SCENES.map((_, i) => `<button class="dot" data-go="${i}" aria-label="${i + 1}. ${SCENE_TITLES[i]}"></button>`).join('');
    dots.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) this.deck.go(+b.dataset.go); });
    attachTapNav($('#lesson'), dir => this.tap(dir));
    addEventListener('keydown', e => { if (App.mode !== 'lesson' || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return; if (e.key === 'ArrowRight') this.tap(1); if (e.key === 'ArrowLeft') this.tap(-1); });
    this.deck.go(L.scene || 0, true);
  },
  tap(dir) { const i = this.deck.target, sc = SCENES[i]; if (sc.onTap && sc.onTap(dir)) return; dir > 0 ? this.deck.next() : this.deck.prev(); },
  go(i) { this.deck.go(i) },
  updateDots() {
    const L = Store.data.lesson, t = this.deck.target;
    $$('#dots .dot').forEach((d, i) => { d.classList.toggle('on', i === t); d.classList.toggle('v', !!L.visited[i]); });
    $('#sceneLabel').textContent = App.mode === 'lesson' ? `${String(t + 1).padStart(2, '0')} / 15 · ${SCENE_TITLES[t]}` : '';
  },
  actors() {
    const d = this.deck, x = d.cam.x, i0 = clamp(Math.floor(x), 0, SCENES.length - 1), i1 = clamp(i0 + 1, 0, SCENES.length - 1), f = clamp(x - i0, 0, 1);
    const get = i => { const sc = SCENES[i], p = d.panels[i]; return Object.assign(corner(), sc.actors && p.mounted ? sc.actors(p.pin) : {}); };

    return o;
  }
};
function anchorsAB(pin, ra = .6) {

    pin.innerHTML = `<div class="wrap top">${head('SCENE 13 · ANALYSIS', '협상 결과 <span class="grad">분석</span>', '모든 수치는 실전에서 실제로 선택한 행동 기록으로 계산됩니다.')}

        <div class="stat"><b>${NM[outcome]}</b><span>결과로 본 갈등 해결 전략</span></div><div class="stat"><b>${s.actions.length}회</b><span>사용한 행동 (${s.turn}턴)</span></div></div>
      ${agreed ? `<div class="card glass small" style="margin-top:12px">최종안 · ${esc(pkgText(s.final))}</div>` : ''}
      <div class="split" style="margin-top:14px;align-items:start"><div class="card glass">${bars.map(b => `<div style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><span>${b[0]}</span><b>${b[1]}</b></div><div class="meter"><i data-w="${b[1]}"></i></div><span class="small muted">${b[2]}</span></div>`).join('')}</div>
      <div><div class="card glass"><p class="eyebrow">행동별 전략 성향</p>${Object.keys(cnt).map(k => `<div class="row" style="gap:8px;margin-bottom:6px"><span style="width:7.5em" class="small">${NM[k]}</span><div class="meter v" style="flex:1"><i data-w="${pct(cnt[k], s.actions.length)}"></i></div><b class="small">${cnt[k]}</b></div>`).join('')}
        <p class="small muted" style="margin:8px 0 0">진행 기록: ${s.actions.map(a => NA[a.k]).join(' → ')}</p></div>

    animateMeters(pin);

<script>
/* ---- js/mm-engine.js ---- */
/* ============ MEMORY MASTER ENGINE: rule-based parser, keywords, grading, SRS, question generator ============ */
'use strict';
const KO_ORD = '가나다라마바사아자차카타파하';
const GENERIC = /^(개념|정의|뜻|의미|특징|특성|유의점|주의점|효과|시사점|예시|사례|종류|장점|단점|한계|원인|결과|영향|목적|역할|기능|구성|유형)$/;
const DEF_GENERIC = /^(개념|정의|뜻|의미)$/;
const ORDER_RE = /(과정|단계|순서|절차|전개|흐름|진행)/;
const PARTICLES = ['으로부터', '에서부터', '이라는', '에게서', '으로써', '으로서', '에서는', '에서도', '이라고', '라는', '하여', '하는', '하고', '하게', '해야', '하며', '하면', '되는', '되어', '된다', '한다', '이다', '에서', '에게', '으로', '까지', '부터', '처럼', '보다', '이나', '이며', '이고', '과의', '와의', '들의', '들이', '들을', '들은', '은', '는', '이', '가', '을', '를', '에', '의', '와', '과', '로', '도', '만', '며', '고', '함', '됨', '음', '한', '할', '된'];
const STOP = new Set(['것', '수', '등', '및', '또는', '그리고', '위해', '위한', '대한', '대해', '통해', '통한', '따라', '있는', '있음', '있다', '없는', '없다', '하다', '되다', '이런', '그런', '이러한', '그러한', '모든', '더', '더이상', '경우', '때', '중', '이를', '이것', '그것', '매우', '측', '사용', '방식', '상태', '부분', '그', '이', '저', '어떤', '같은', '다른', '부터', '까지', '그러', '한다', '하기', '되는', '있도록', '간의', '대해서', '위해서', '이를', 'the', 'a', 'an', 'of', 'to', 'and', 'or', 'in', 'is', 'are', 'for', 'on', 'by', 'with', 'that', 'this', 'as', 'be', 'it']);
const SPLIT_RE = /[\s,.·;:!?()\[\]{}"'“”‘’<>~\/|=+\-–—…》《「」『』]+/;

const MMX = {
  norm: s => String(s || '').toLowerCase().replace(/[^0-9a-z가-힣]/g, ''),
  base: t => String(t).replace(/\([^)]*\)/g, '').replace(/\s+/g, ' ').trim(),
  hash(s) { let h = 2166136261; for (const c of s) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); },
  aliases(term) {
    const out = new Set([this.norm(term), this.norm(this.base(term))]);
    const m = term.match(/\(([^)]*)\)/g);
    if (m) m.forEach(x => x.slice(1, -1).split(/[,，、]/).forEach(p => { p = p.trim(); if (p && p.length <= 14) out.add(this.norm(p)); }));
    out.delete(''); return [...out];
  },
  strip(tok) {
    for (const p of PARTICLES) if (tok.length - p.length >= 2 && tok.endsWith(p)) return tok.slice(0, -p.length);
    return tok;
  },
  tokens(text) { return String(text).split(SPLIT_RE).map(t => this.strip(t.trim())).filter(t => t.length >= 2 && !STOP.has(t.toLowerCase())); },
  splitDef(text) {
    let i = -1;

  marker(line) {

    if ((m = line.match(/^\s*#{1,3}\s*(.+)$/))) return { lvl: 1, text: m[1] };

  /* -------- parse raw text into chapters / concepts / facts -------- */
  parse(text) {
    const lines = String(text || '').replace(/\r/g, '').split('\n');

    const mkConcept = (term, def, line, lvl, parent) => {
      const key = this.norm(term) || 'x'; let id = 'c_' + this.hash(key); used[id] = (used[id] || 0) + 1; if (used[id] > 1) id += '_' + used[id];

        if (sd && sd.term.length <= 30) { lastC = mkConcept(sd.term, sd.def, li, 3, stack[stack.length - 1]); return; }

        const node = { lvl: mk.lvl, name: term, cid: c.id, items: [], num: mk.num, line: li, parent };

      if (mk.lvl === 1) newCh(name);

      nodes.push(node); parent && parent.items.push({ text: name, num: mk.num, node });

      const leaf = n.items.filter(it => !it.node || !it.node.items.length);

        if (n.items.some(it => it.node && it.node.items.length && !it.cid)) continue;
        const nums = n.items.map(it => it.num).filter(Boolean), seq = nums.length === n.items.length && nums.every((v, i) => v === i + 1);
        const ordered = seq && n.items.length >= 3 && (ORDER_RE.test(n.name) || (n.parent && ORDER_RE.test(n.parent.name) && /단계|절차/.test(n.name)));
        const key = this.norm(n.name); let id = 'c_' + this.hash(key); used[id] = (used[id] || 0) + 1; if (used[id] > 1) id += '_' + used[id];
        const chId = (R.chapters.slice().reverse().find(ch => true) || {}).id;
        const c = { id, term: n.name, def: n.items.map(it => it.text).join(' / '), items: n.items.map(it => it.text), ordered, kind: 'list', line: n.line + 1, lvl: n.lvl, parentId: n.parent && n.parent.cid || null, parentName: n.parent ? n.parent.name : null, chapterId: null };
        c.chapterId = this.chapterAt(R, nodes, n) || chId; n.cid = id;
        n.items.forEach(it => { if (it.node && it.cid) { const cc = R.concepts.find(x => x.id === it.cid); if (cc && !cc.parentId) cc.parentId = id; } });

    for (const n of nodes) {
      if (n.cid && n.items.length && !R.concepts.find(x => x.id === n.cid && x.kind === 'list')) {
        n.items.filter(it => !it.cid && !(it.node && it.node.cid)).forEach(it => R.facts.push({ id: 'f' + R.facts.length, text: it.text, conceptId: n.cid, chapterId: (R.concepts.find(x => x.id === n.cid) || {}).chapterId, line: it.node ? it.node.line + 1 : n.line + 1 }));

    }
    // parent ids for children created before parent became a concept
    for (const n of nodes) for (const it of n.items) if (it.node && it.node.cid && n.cid) { const cc = R.concepts.find(x => x.id === it.node.cid); if (cc && !cc.parentId && cc.id !== n.cid) { cc.parentId = n.cid; cc.parentName = n.name; } }

    const numRe = /(\d{1,4}\s?년(?:\s?\d{1,2}\s?월)?(?:\s?\d{1,2}\s?일)?|\d+(?:\.\d+)?\s?(?:%|℃|°C|km|kg|cm|mm|m|g|L|원|만\s?원|명|개|배|세기))/g;

  chapterAt(R, nodes, n) { let p = n; while (p.parent) p = p.parent; const ch = R.chapters.find(c => this.norm(c.name) === this.norm(this.base(p.name))); return ch ? ch.id : null; },
  enrich(R, text) {

      const verb = /(여서|어서|아서|하여|기|게|지|며|면|어|아|던|든|려|러|도록|었|았|겠|시키|하려|거나|하고|이르|되어|된|져|워|해)$/;
      const sc = t => (/\d|[A-Z]{2,}/.test(t) ? 3 : 0) + Math.min(t.length, 5) * .45 + Math.log(1 + N / (df[t] || 1)) * 1.4 - (verb.test(t) ? 2.6 : 0) - (/^[a-z]+$/.test(t) && t.length < 4 ? 1 : 0);
      const k = clamp(Math.round(toks.length / 3.2), 2, 5);
      if (c.kind === 'list') { const its = c.items.map(i => [...new Set(this.tokens(i))]); const all = t => its.every(x => x.includes(t)); c.keywords = its.map(x => x.filter(t => !all(t)).sort((a, b) => sc(b) - sc(a))[0]).filter(Boolean).slice(0, 8); }
      else c.keywords = toks.sort((a, b) => sc(b) - sc(a)).slice(0, k);
      const b = this.norm(this.base(c.term)); let freq = 0, i = -1; if (b.length >= 2) while ((i = normText.indexOf(b, i + 1)) >= 0) freq++;

      if (/의 (시사점|예시|사례)$/.test(this.base(c.term))) c.importance = '보충';

  },
  /* -------- grading -------- */
  lev(a, b) { const m = a.length, n = b.length; if (!m) return n; if (!n) return m; const d = Array.from({ length: m + 1 }, (_, i) => [i]); for (let j = 1; j <= n; j++) d[0][j] = j; for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[m][n]; },
  dice(a, b) { a = this.norm(a); b = this.norm(b); if (a.length < 2 || b.length < 2) return a === b ? 1 : 0; const g = s => { const m = new Map(); for (let i = 0; i < s.length - 1; i++) { const k = s.slice(i, i + 2); m.set(k, (m.get(k) || 0) + 1); } return m; }; const A = g(a), B = g(b); let x = 0; A.forEach((v, k) => x += Math.min(v, B.get(k) || 0)); return 2 * x / (a.length + b.length - 2); },
  gradeTerm(ans, c, strict) {

  },
  gradeDef(ans, c, strict) {

/* -------- material store, stats, SRS -------- */
const INTERVALS = [10, 1440, 4320, 10080, 20160, 43200]; // minutes — adjustable defaults
const MMData = {
  mats() { return Store.data.mm.materials; },
  cur() { return this.mats()[Store.data.mm.current] || null; },
  create(title, text, extra = {}) {
    const P = MMX.parse(text), id = 'm' + uid();
    const m = { id, v: 1, title: title || P.title || '새 학습자료', text, created: Date.now(), updated: Date.now(), P, stats: {}, exams: [], log: [], time: 0, extras: extra.extras || null, cases: extra.cases || null, sample: !!extra.sample, settings: { mode: 'understand' }, imp: {} };
    this.mats()[id] = m; Store.data.mm.current = id; Store.save(); return m;
  },
  update(m, title, text) {
    const old = m.P, P = MMX.parse(text); let kept = 0, changed = 0, added = 0;
    const oldBy = {}; old.concepts.forEach(c => oldBy[c.id] = c);
    P.concepts.forEach(c => { const o = oldBy[c.id]; if (!o) { added++; return; } if (MMX.norm(o.def) === MMX.norm(c.def)) kept++; else { changed++; const s = m.stats[c.id]; if (s) { s.verified = 0; s.und = 0; s.lvl = 0; s.box = 0; } } });
    const removed = old.concepts.filter(o => !P.concepts.some(c => c.id === o.id)).length;
    P.concepts.forEach(c => { if (m.imp[c.id]) c.importance = m.imp[c.id]; });
    m.P = P; m.text = text; m.title = title || m.title; m.v++; m.updated = Date.now(); Store.save();
    return { kept, changed, added, removed };
  },
  st(m, cid) { return m.stats[cid] || (m.stats[cid] = { seen: 0, und: 0, undTry: 0, lvl: 0, att: 0, ok: 0, bad: 0, last: null, lastAt: 0, hint: 0, streak: 0, rt: 0, box: 0, next: 0, verified: 0, vAt: 0, mcqOk: 0, recallOk: 0, selfOk: 0, hintOk: 0 }); },
  concept(m, cid) { return m.P.concepts.find(c => c.id === cid); },
  extra(m, c) { if (!m.extras) return null; const k = MMX.norm(MMX.base(c.term)).replace(/[^가-힣a-z0-9]/g, ''); for (const key in m.extras) if (MMX.norm(key) === k) return m.extras[key]; return null; },
  required(m) { return m.P.concepts.filter(c => c.importance !== '보충'); },
  state(m, cid) { const s = m.stats[cid]; if (!s || !s.seen) return 'none'; if (s.verified) return Date.now() > s.next ? 'review' : 'verified'; return 'learning'; },
  stateLabel: { none: '미학습', learning: '학습 중', verified: '검증된 기억', review: '복습 필요' },
  interval(box) { return INTERVALS[clamp(box, 0, 5)] * 60000 * (Store.data.mm.settings.revMul || 1); },
  seen(m, cid) { const s = this.st(m, cid); s.seen++; s.lastAt = Date.now(); },
  /* mode: 'mcq' | 'recall' | 'self' | 'hint' | 'understand' */
  record(m, cid, ok, mode, extra = {}) {
    const s = this.st(m, cid), now = Date.now(); s.seen = Math.max(1, s.seen); s.att++; ok ? s.ok++ : s.bad++; s.last = ok; s.lastAt = now; s.streak = ok ? s.streak + 1 : 0; if (extra.rt) s.rt = extra.rt;
    if (extra.hints) s.hint += extra.hints;
    if (ok) {
      if (mode === 'mcq') s.mcqOk++;
      if (mode === 'hint') s.hintOk++;
      if (mode === 'recall' || mode === 'self') { mode === 'self' ? s.selfOk++ : s.recallOk++; if (!s.verified) s.vAt = now; s.verified = 1; s.box = Math.min(5, s.box + 1); s.next = now + this.interval(s.box); }
      else if (!s.next) s.next = now + this.interval(s.box);
    } else { s.box = 0; s.next = now + this.interval(0); if (mode === 'recall') s.verified = 0; }
    m.log.push({ t: now, cid, ok: ok ? 1 : 0, mode, src: extra.src || '' }); if (m.log.length > 400) m.log.splice(0, m.log.length - 400);
    const d = Store.data.days[dayKey()] || (Store.data.days[dayKey()] = { q: 0, ok: 0, sec: 0 }); d.q++; if (ok) d.ok++;
    Store.save();
  },
  metrics(m) {
    const C = m.P.concepts, req = this.required(m), S = m.stats, now = Date.now();
    const started = C.filter(c => S[c.id] && S[c.id].seen).length, verified = req.filter(c => S[c.id] && S[c.id].verified).length;
    const und = C.filter(c => S[c.id] && S[c.id].und).length, review = C.filter(c => S[c.id] && S[c.id].verified && now > S[c.id].next).length;
    const lastExam = m.exams[m.exams.length - 1];
    return { total: C.length, req: req.length, started, verified, und, review, learning: started - C.filter(c => S[c.id] && S[c.id].verified).length,
      progress: pct(started, C.length), mastery: pct(verified, req.length), understanding: pct(und, C.length), exam: lastExam ? lastExam.rate : null, retain: pct(verified - req.filter(c => S[c.id] && S[c.id].verified && now > S[c.id].next).length, req.length) };
  },
  priority(m) {
    const now = Date.now();
    return m.P.concepts.map(c => { const s = m.stats[c.id]; if (!s || !s.seen) return { c, p: -1 };
      const wr = s.att ? s.bad / s.att : .5, over = s.next && now > s.next ? Math.min(3, (now - s.next) / 86400000 + 1) : 0;
      return { c, p: wr * 3 + over + (s.last === false ? 2 : 0) + (s.verified ? 0 : 1) - Math.min(s.streak, 5) * .3 + (s.hintOk > s.recallOk ? .5 : 0) }; })
      .filter(x => x.p >= 0).sort((a, b) => b.p - a.p);
  }
};

/* -------- question generator (all from the material; returns null when no valid question) -------- */
const QGen = {
  others(m, c, n, same = true) { let pool = m.P.concepts.filter(x => x.id !== c.id && MMX.norm(x.def) !== MMX.norm(c.def) && MMX.norm(MMX.base(x.term)) !== MMX.norm(MMX.base(c.term))); const sc = pool.filter(x => x.chapterId === c.chapterId); if (same && sc.length >= n) pool = sc.concat(shuffle(pool.filter(x => x.chapterId !== c.chapterId))); return shuffle(pool.slice(0, Math.max(n * 3, n))).slice(0, n); },
  mask(m, c) { let d = c.def; c.aliases.concat([MMX.base(c.term)]).forEach(a => { const b = MMX.base(c.term); if (b.length >= 2) d = d.split(b).join('○○'); }); return d; },
  make(m, type, c) {
    const o = this.others(m, c, 3);
    switch (type) {
      case 'mcq-def': if (o.length < 1) return null; return { type: 'mcq', mode: 'mcq', cid: c.id, prompt: `「${c.term}」의 뜻으로 알맞은 것은?`, options: shuffle([{ t: c.def, ok: 1 }, ...o.map(x => ({ t: x.def, cid: x.id }))]) };
      case 'mcq-term': if (o.length < 1) return null; return { type: 'mcq', mode: 'mcq', cid: c.id, prompt: `다음 설명에 해당하는 개념은?\n“${this.mask(m, c)}”`, options: shuffle([{ t: c.term, ok: 1 }, ...o.map(x => ({ t: x.term, cid: x.id }))]) };
      case 'tf': { if (!o.length) return null; const truth = Math.random() < .5, x = o[0]; return { type: 'tf', mode: 'mcq', cid: c.id, prompt: `${c.term} — ${truth ? c.def : x.def}`, answer: truth, explain: truth ? '원본과 일치하는 문장입니다.' : `이 설명은 「${x.term}」의 내용입니다. 「${c.term}」은(는): ${c.def}` }; }
      case 'typed-term': return { type: 'typed-term', mode: 'recall', cid: c.id, prompt: `설명을 보고 개념 이름을 직접 쓰세요.\n“${this.mask(m, c)}”` };
      case 'typed-def': return { type: 'typed-def', mode: 'recall', cid: c.id, prompt: `「${c.term}」을(를) 설명하세요.${c.kind === 'list' ? ` (항목 ${c.items.length}개)` : ''}` };
      case 'blank': { if (c.kind === 'list' || !c.keywords.length) return null; const ks = shuffle(c.keywords.filter(k => c.def.includes(k))).slice(0, c.keywords.length >= 4 ? 2 : 1); if (!ks.length) return null;
        let d = c.def; const parts = []; ks.forEach(k => { const i = d.indexOf(k); if (i >= 0) parts.push({ i, k }); }); parts.sort((a, b) => a.i - b.i);
        const pool = shuffle([...new Set(m.P.concepts.filter(x => x.id !== c.id).flatMap(x => x.keywords))].filter(k => !ks.includes(k))).slice(0, 4);
        return { type: 'blank', mode: 'recall', cid: c.id, prompt: `「${c.term}」 빈칸을 채우세요.`, def: c.def, blanks: parts.map(p => p.k), choices: shuffle([...ks, ...pool]) }; }
      case 'order': if (!c.ordered) return null; return { type: 'order', mode: 'recall', cid: c.id, prompt: `「${c.term}」을(를) 올바른 순서로 배열하세요.`, items: c.items.slice() };
      case 'parent': { if (!c.parentName) return null; const ps = [...new Set(m.P.concepts.filter(x => x.parentName && x.parentName !== c.parentName).map(x => x.parentName))]; if (!ps.length) return null;
        return { type: 'mcq', mode: 'mcq', cid: c.id, prompt: `「${c.term}」은(는) 원본 자료에서 어느 상위 항목에 속하는가?`, options: shuffle([{ t: c.parentName, ok: 1 }, ...shuffle(ps).slice(0, 3).map(t => ({ t }))]) }; }
      case 'compare': { const x = m.P.concepts.filter(y => y.id !== c.id && y.chapterId === c.chapterId && y.kind === 'def'); if (!x.length || c.kind !== 'def') return null; const y = pick(x);
        return { type: 'compare', mode: 'self', cid: c.id, cid2: y.id, prompt: `「${c.term}」와(과) 「${y.term}」의 차이를 설명하세요.` }; }
      case 'case': { if (!m.cases) return null; const cs = m.cases.filter(k => MMX.norm(c.term).includes(MMX.norm(k.term)) || MMX.norm(k.term).includes(MMX.norm(MMX.base(c.term)))); if (!cs.length) return null; const k = pick(cs);
        const ord = shuffle(k.opts.map((t, i) => ({ t, ok: i === k.a ? 1 : 0 }))); return { type: 'mcq', mode: 'mcq', cid: c.id, gen: true, prompt: k.q, options: ord, explain: k.ex }; }
    }
    return null;
  },
  any(m, types, c, tries = 6) { for (let i = 0; i < tries; i++) { const q = this.make(m, pick(types), c); if (q) return q; } for (const t of types) { const q = this.make(m, t, c); if (q) return q; } return null; },
  countAvail(m) { const T = ['mcq-def', 'mcq-term', 'tf', 'typed-term', 'typed-def', 'blank', 'order', 'parent', 'compare', 'case']; let n = 0; m.P.concepts.forEach(c => T.forEach(t => { if (t === 'tf' || t === 'compare') { if (QGen.make(m, t, c)) n++; } else if (QGen.make(m, t, c)) n++; })); return n; }
};

          <textarea class="field" id="uNote" style="min-height:70px;margin-top:8px" placeholder="나만의 쉬운 설명 (선택)">${esc((m.notes || {})[c.id] || '')}</textarea></div>
          <div class="card glass" style="margin-top:12px"><p class="eyebrow">③ 실제 사례</p>${ex && ex.ex ? `<span class="src gen">예시 · 원문 아님</span><p>${esc(ex.ex)}</p>` : m.P.facts.filter(f => f.conceptId === c.id).length ? `<span class="src orig">원문 관련 내용</span>${m.P.facts.filter(f => f.conceptId === c.id).map(f => `<p class="small">${esc(f.text)}</p>`).join('')}` : '<p class="muted small">원본에 사례가 없어 지어내지 않았습니다.</p>'}</div>
          <div class="card glass" style="margin-top:12px"><p class="eyebrow">④ 원본 연결</p><span class="src orig">원문 · ${c.line}행</span><p>${this.hl(c)}</p></div></div></div>
      <div class="card glass" style="margin-top:16px"><p class="eyebrow">⑤ 이해 확인 ${s.und ? '<span class="badge ok">통과</span>' : ''}</p><div id="uQ"></div></div>
      <div class="row" style="justify-content:space-between;margin-top:14px"><button class="btn" data-u="-1">← 이전 개념</button><button class="btn" data-u="1">다음 개념 →</button></div></div>`;
    this.bindVis(pin, m, c);
    const ask = () => { const q = QGen.any(m, vs.alt % 2 ? ['mcq-term', 'mcq-def'] : ['mcq-def', 'mcq-term'], c) || QGen.make(m, 'typed-term', c);
      this.run($('#uQ', pin), m, q, { record: false, src: 'understand' }, r => {
        s.undTry++; if (r.ok) { s.und = 1; MMData.record(m, c.id, true, 'mcq', { src: 'understand' }); vs.alt = 0; if (vs.i < C.length - 1) vs.i++; this.refresh(); toast('이해 확인 통과! 다음 개념으로 이동합니다.'); }
        else { MMData.record(m, c.id, false, 'mcq', { src: 'understand' }); vs.alt++; this.refresh(); toast('쉬운 설명 → 시각화 → 다른 설명 방식으로 다시 확인해 보세요.', 3200); $('#uVis', pin).innerHTML = this.vis(m, c); this.bindVis(pin, m, c); }
        Store.save(); }); };
    ask();
    pin.onclick = e => { const u = e.target.closest('[data-u]'); if (u) { vs.i = clamp(vs.i + +u.dataset.u, 0, C.length - 1); vs.alt = 0; this.refresh(); } };
    $('#uPick', pin).onchange = e => { vs.i = +e.target.value; vs.alt = 0; this.refresh(); };
    $('#uNote', pin).oninput = e => { m.notes = m.notes || {}; m.notes[c.id] = e.target.value; Store.save(); };
  },
  /* concept visualization: special labs when the concept exists in the material, else keyword constellation */
  vis(m, c) {
    const al = c.aliases.join(' ');
    if (/zopa|합의가능영역/.test(al) && !/시사점|예시/.test(c.term)) return `<p class="small muted">양측 범위를 움직여 겹치는 구간을 확인하세요.</p><svg class="svgbox" viewBox="0 0 520 150" id="vz"></svg><div class="grid g2"><div><label class="lab">A 범위 끝 <span id="vza"></span></label><input type="range" min="30" max="90" value="60" data-vz="a"></div><div><label class="lab">B 범위 시작 <span id="vzb"></span></label><input type="range" min="20" max="80" value="50" data-vz="b"></div></div>`;
    if (/batna|복안/.test(al) && c.kind === 'def') return `<p class="small muted">협상이 결렬되면 할 수 있는 대안 중 가장 유리한 것을 고르세요.</p>${[['다른 가게에서 45만 원에 구매', 1], ['아예 사지 않기', 0], ['3주 뒤 중고 매물 기다리기 (불확실)', 0]].map((x, i) => `<button class="opt" data-vb="${x[1]}">${x[0]}</button>`).join('')}<div id="vbOut"></div>`;
    const st = CONFLICT.find(x => al.includes(MMX.norm(x.name)));
    if (st) return quizVis('strat:' + st.id) + `<p class="small muted" style="text-align:center">자신의 요구(가로) × 상대의 요구(세로)에서 「${st.name}」의 위치</p>`;
    if (c.kind === 'list' && c.ordered) return `<svg class="svgbox" viewBox="0 0 520 ${c.items.length * 54 + 20}">${c.items.map((t, i) => `<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="${i * .35}s" dur=".5s" fill="freeze"/><circle cx="40" cy="${30 + i * 54}" r="16" fill="rgba(90,209,255,.2)" stroke="#5ad1ff"/><text x="40" y="${36 + i * 54}" text-anchor="middle" fill="#fff" font-weight="800">${i + 1}</text><text x="70" y="${36 + i * 54}" fill="#fff" font-size="16">${esc(t.length > 30 ? t.slice(0, 30) + '…' : t)}</text>${i < c.items.length - 1 ? `<line x1="40" y1="${46 + i * 54}" x2="40" y2="${68 + i * 54}" stroke="#5ad1ff"/>` : ''}</g>`).join('')}</svg>`;
    const ks = c.kind === 'list' ? c.items.map(t => t.length > 14 ? t.slice(0, 13) + '…' : t) : c.keywords, n = ks.length, R = 120;
    return `<svg class="svgbox" viewBox="0 0 520 320"><defs><radialGradient id="cg"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#5ad1ff"/><stop offset="1" stop-color="#2b7bff" stop-opacity="0"/></radialGradient></defs>
      <circle cx="260" cy="160" r="60" fill="url(#cg)" opacity=".5"><animate attributeName="r" values="40;64;56" dur="1.4s" fill="freeze"/></circle>
      ${ks.map((k, i) => { const a = -Math.PI / 2 + i / n * Math.PI * 2, x = 260 + Math.cos(a) * R * 1.45, y = 160 + Math.sin(a) * R * .95; return `<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="${.5 + i * .25}s" dur=".6s" fill="freeze"/><line x1="260" y1="160" x2="${x}" y2="${y}" stroke="#5ad1ff" stroke-opacity=".35" stroke-dasharray="4 5"/><circle cx="${x}" cy="${y}" r="7" fill="#a98bff"><animate attributeName="cx" from="260" to="${x}" begin="${.5 + i * .25}s" dur=".8s" fill="freeze"/><animate attributeName="cy" from="160" to="${y}" begin="${.5 + i * .25}s" dur=".8s" fill="freeze"/></circle><text x="${x}" y="${y - 14}" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">${esc(k)}</text></g>`; }).join('')}
      <text x="260" y="167" text-anchor="middle" fill="#fff" font-size="${MMX.base(c.term).length > 8 ? 16 : 22}" font-weight="800">${esc(MMX.base(c.term).slice(0, 14))}</text></svg><p class="small muted" style="text-align:center">개념 → 핵심어 구조 (원문에서 추출)</p>`;
  },
  bindVis(pin, m, c) {
    const vz = $('#vz', pin);
    if (vz) { const draw = () => { const a = +$('[data-vz=a]', pin).value, b = +$('[data-vz=b]', pin).value, X = v => 20 + (v - 20) * 6.8, lo = Math.max(40, b), hi = Math.min(a, 70);
      $('#vza', pin).textContent = a; $('#vzb', pin).textContent = b;
      vz.innerHTML = `<rect x="${X(40)}" y="30" width="${X(a) - X(40)}" height="18" rx="9" fill="#2b7bff"/><text x="${X(40)}" y="22" fill="#9fdcff" font-size="13">A 40~${a}</text><rect x="${X(b)}" y="92" width="${X(70) - X(b)}" height="18" rx="9" fill="#8a5cff"/><text x="${X(b)}" y="132" fill="#d9c6ff" font-size="13">B ${b}~70</text>
        ${hi >= lo ? `<rect x="${X(lo)}" y="24" width="${Math.max(2, X(hi) - X(lo))}" height="92" rx="6" fill="rgba(95,240,196,.22)" stroke="#5ff0c4"/><text x="${(X(lo) + X(hi)) / 2}" y="76" text-anchor="middle" fill="#5ff0c4" font-weight="800">ZOPA ${lo}~${hi}</text>` : `<text x="260" y="76" text-anchor="middle" fill="#ff7a90" font-weight="800">겹치는 구간 없음 → 합의 가능 영역 없음</text>`}`; };
      $$('[data-vz]', pin).forEach(r => r.oninput = draw); draw(); }
    $$('[data-vb]', pin).forEach(b => b.onclick = () => { const ok = b.dataset.vb === '1'; b.classList.add(ok ? 'ok' : 'bad'); $('#vbOut', pin).innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'} small">${ok ? '실행 가능하고 가장 유리한 대안 = BATNA. 이 값이 지금 협상의 양보점(하한선)이 됩니다.' : '선택할 수는 있지만 가장 유리한 대안은 아닙니다.'}</div>`; });
  },

  /* ======================= STEP 1 MEMORY FORMATION ======================= */
  v_form(pin, m) {
    const C = m.P.concepts, vs = this.vs.form || (this.vs.form = { i: Math.max(0, C.findIndex(c => !(m.stats[c.id] && m.stats[c.id].verified))), lvl: 1 });
    if (vs.i < 0 || vs.i >= C.length) vs.i = 0;
    const c = C[vs.i], s = MMData.st(m, c.id); if (!vs.lvl) vs.lvl = Math.min(5, Math.max(1, s.lvl || 1));
    const L = ['', '전체 내용 보기', '핵심 단어 기억하기', '부분 숨기기', '최소 힌트', '완전 회상'];
    pin.innerHTML = `<div class="wrap top">${this.hdr(2, '기억 형성 훈련', '하나의 개념을 다섯 단계로 점점 덜 보면서 기억합니다.')}
      <div class="row" style="justify-content:space-between"><select class="field" id="fPick" style="max-width:420px;min-height:44px">${C.map((x, k) => `<option value="${k}" ${k === vs.i ? 'selected' : ''}>${m.stats[x.id] && m.stats[x.id].verified ? '★ ' : ''}${esc(x.term)}</option>`).join('')}</select>
        <div class="seg" style="flex:0 0 auto"><button data-mode="understand" class="${m.settings.mode !== 'exact' ? 'on' : ''}" style="flex:0 0 auto">개념 이해 모드</button><button data-mode="exact" class="${m.settings.mode === 'exact' ? 'on' : ''}" style="flex:0 0 auto">정확 암기 모드</button></div></div>
      <div class="row" style="margin:14px 0">${[1, 2, 3, 4, 5].map(l => `<button class="chip ${l === vs.lvl ? 'on' : ''} ${l > (s.lvl || 0) + 1 ? 'lock' : ''}" data-lv="${l}">LEVEL ${l} · ${L[l]}</button>`).join('')}</div>
      <div class="card glass" id="fBox"></div>
      <p class="small muted">${m.settings.mode === 'exact' ? '정확 암기 모드: 정의의 표현을 원문과 비교합니다 (일치도 85% 이상 자동 정답).' : '개념 이해 모드: 핵심어 포함으로 의미를 판정하고, 애매하면 자가 확인합니다.'} · 최고 달성 LEVEL ${s.lvl || 0}</p></div>`;
    const box = $('#fBox', pin), pass = lv => { s.lvl = Math.max(s.lvl || 0, lv); Store.save(); if (lv < 5) { vs.lvl = lv + 1; } else { toast('완전 회상 성공! 다음 개념으로 이동합니다.'); vs.i = Math.min(C.length - 1, vs.i + 1); vs.lvl = 1; } this.refresh(); };
    const failTo = lv => { s.struggle = lv; vs.lvl = Math.max(1, lv); Store.save(); toast(`LEVEL ${vs.lvl}로 돌아가 다시 다집니다.`); this.refresh(); };
    const lv = vs.lvl;
    if (lv === 1) { box.innerHTML = `<p class="eyebrow">LEVEL 1</p><h3 class="h2">${esc(c.term)}</h3><p style="font-size:calc(var(--tb)*1.15);line-height:1.8">${this.hl(c)}</p><span class="src orig">원문 · ${c.line}행</span><div class="row" style="margin-top:14px"><button class="btn" id="fTts">🔊 읽어주기</button><button class="btn primary" id="fOk">다 읽었어요 → LEVEL 2</button></div>`;
      $('#fTts', pin).onclick = () => speak(`${MMX.base(c.term)}. ${c.def}`); $('#fOk', pin).onclick = () => { MMData.seen(m, c.id); pass(1); }; }
    else if (lv === 2) {
      const dis = shuffle([...new Set(C.filter(x => x.id !== c.id).flatMap(x => x.keywords))].filter(k => !c.keywords.includes(k))).slice(0, Math.max(3, c.keywords.length));
      const all = shuffle([...c.keywords, ...dis]), picked = new Set();
      box.innerHTML = `<p class="eyebrow">LEVEL 2 · 핵심 단어</p><h3 class="h3">${esc(c.term)}</h3><div id="kwShow" class="row" style="margin:12px 0">${c.keywords.map((k, i) => `<span class="badge" style="font-size:var(--t3);padding:10px 18px;animation:morphIn .8s ${i * .2}s both;color:var(--cyan)">${esc(k)}</span>`).join('')}</div>
        <button class="btn" id="kwHide">외웠어요 · 숨기고 고르기</button><div id="kwPick"></div>`;
      $('#kwHide', pin).onclick = () => { $('#kwShow', pin).style.display = 'none'; $('#kwHide', pin).style.display = 'none';
        $('#kwPick', pin).innerHTML = `<p>「${esc(c.term)}」의 핵심 단어 ${c.keywords.length}개를 모두 고르세요.</p><div class="row">${all.map(k => `<button class="chip" data-kw="${esc(k)}">${esc(k)}</button>`).join('')}</div><button class="btn primary" id="kwChk" style="margin-top:12px">확인</button><div class="qfb"></div>`;
        $('#kwPick', pin).onclick = e => { const b = e.target.closest('[data-kw]'); if (!b) return; const k = b.dataset.kw; picked.has(k) ? picked.delete(k) : picked.add(k); b.classList.toggle('on'); };
        $('#kwChk', pin).onclick = () => { const ok = c.keywords.every(k => picked.has(k)) && picked.size === c.keywords.length; MMData.record(m, c.id, ok, 'mcq', { src: 'form2' }); ok ? Fx.ok() : Fx.bad();
          $$('[data-kw]', pin).forEach(b => b.classList.add(c.keywords.includes(b.dataset.kw) ? 'on' : 'lock'));
          $('.qfb', pin).innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}">${ok ? '핵심 단어를 모두 기억했습니다.' : `정답: ${c.keywords.map(esc).join(', ')}`}</div><button class="btn primary" style="margin-top:10px" id="kwNext">${ok ? 'LEVEL 3 →' : '다시 보기'}</button>`;
          $('#kwNext', pin).onclick = () => ok ? pass(2) : this.refresh(); }; };
    }
    else if (lv === 3) { const q = c.kind === 'list' ? QGen.make(m, 'typed-def', c) : QGen.make(m, 'blank', c);
      if (!q) { box.innerHTML = '<p>이 개념은 빈칸을 만들 핵심어가 부족해 LEVEL 4로 넘어갑니다.</p><button class="btn primary" id="sk">LEVEL 4 →</button>'; $('#sk', pin).onclick = () => pass(3); return; }
      box.innerHTML = '<p class="eyebrow">LEVEL 3 · 부분 숨기기</p><div id="fq"></div>'; this.run($('#fq', pin), m, q, { src: 'form3', choices: true, hints: c.kind === 'list' }, r => r.ok ? pass(3) : failTo(2)); }
    else if (lv === 4) { const ws = c.def.split(/\s+/); box.innerHTML = `<p class="eyebrow">LEVEL 4 · 최소 힌트</p><h3 class="h2">${esc(c.term)}</h3><p class="muted">힌트: "${esc(ws[0])} …" · 핵심어 첫 글자 ${c.keywords.map(k => esc(k[0]) + '○').join(', ')}</p><div id="fq"></div>`;
      this.run($('#fq', pin), m, { type: 'typed-def', mode: 'self', cid: c.id, prompt: '정의를 떠올려 쓰세요.' }, { src: 'form4', record: false }, r => { MMData.record(m, c.id, r.ok, 'hint', { src: 'form4' }); r.ok ? pass(4) : failTo(3); }); }
    else { box.innerHTML = `<p class="eyebrow">LEVEL 5 · 완전 회상 (힌트 없음)</p><div id="fq"></div>`;
      this.run($('#fq', pin), m, Object.assign(QGen.make(m, c.ordered && Math.random() < .5 ? 'order' : 'typed-def', c), { prompt: c.ordered ? `「${c.term}」 — 힌트 없이 회상하세요.` : `「${c.term}」 — 힌트 없이 설명하세요.` }), { src: 'form5' }, r => r.ok ? pass(5) : failTo(s.struggle && s.struggle < 5 ? s.struggle : 4)); }
    pin.onclick = e => { const l = e.target.closest('[data-lv]'); if (l) { const k = +l.dataset.lv; if (k > (s.lvl || 0) + 1) return toast('이전 단계를 먼저 통과하세요.'); vs.lvl = k; this.refresh(); }
      const md = e.target.closest('[data-mode]'); if (md) { m.settings.mode = md.dataset.mode; Store.save(); this.refresh(); } };
    $('#fPick', pin).onchange = e => { vs.i = +e.target.value; vs.lvl = 0; this.refresh(); };
  }
};

</script>
<script>
/* ---- js/mm-ui2.js ---- */
/* ============ MEMORY MASTER UI (part 2): arcade, universe, recall, weakness, exam, final, analytics, settings ============ */
'use strict';
const GAMES = [
  ['hunter', 'KEYWORD HUNTER', '핵심 단어 사냥', '떠다니는 단어 중 설명에 맞는 개념을 터치'], ['vanish', 'VANISHING KNOWLEDGE', '사라지는 지식', '단어가 하나씩 사라진 뒤 직접 떠올리기'],
  ['flash', 'MEMORY FLASH', '순간 기억', '정해진 시간 동안 보고 기억한 내용 입력'], ['match', 'CONCEPT MATCH', '개념 짝 맞추기', '개념 카드와 정의 카드 연결'],
  ['order', 'ORDER MASTER', '순서의 지배자', '순서가 중요한 항목을 올바르게 배열'], ['tf', 'TRUE OR FALSE', '진실과 거짓', '원문 기반 문장의 O / X 판단'],
  ['blank', 'BLANK BREAKER', '빈칸 파괴자', '숨겨진 핵심어 복원'], ['net', 'MEMORY NETWORK', '지식 연결', '원본 구조의 상위·하위 개념 연결'],
  ['reverse', 'REVERSE RECALL', '역방향 회상', '설명을 보고 개념 이름 직접 쓰기'], ['rush', 'KNOWLEDGE RUSH', '지식 연속 도전', '유형이 계속 바뀌는 종합 도전']];

Object.assign(MMUI, {
  pool(m, n, f = () => true) {
    const pr = MMData.priority(m).map(x => x.c).filter(f), rest = shuffle(m.P.concepts.filter(c => f(c) && !pr.includes(c)));
    const all = [...pr.slice(0, Math.ceil(n / 2)), ...shuffle([...pr.slice(Math.ceil(n / 2)), ...rest])];
    return [...new Set(all)].slice(0, n);
  },
  parentsWithKids(m) { return m.P.concepts.filter(p => m.P.concepts.filter(c => c.parentId === p.id).length >= 2); },
  gameAvail(m, id) {
    const C = m.P.concepts, defs = C.filter(c => c.kind === 'def');
    if (id === 'order') return C.some(c => c.ordered) || '이 자료에는 순서가 중요한 목록(과정·단계·절차)이 없어 순서 문제를 만들지 않습니다.';
    if (id === 'net') return this.parentsWithKids(m).length >= 2 || '원본에서 확인 가능한 상위·하위 구조가 부족합니다.';
    if (id === 'match' || id === 'hunter') return defs.length >= 3 || '정의가 있는 개념이 3개 이상 필요합니다.';
    if (id === 'blank') return C.some(c => QGen.make(m, 'blank', c)) || '빈칸을 만들 핵심어가 없습니다.';
    return C.length >= 2 || '개념이 2개 이상 필요합니다.';
  },
  gameHead(id) { const g = GAMES.find(x => x[0] === id); return `<div class="row" style="justify-content:space-between;margin-bottom:10px"><div><p class="eyebrow" style="margin:0">${g[1]}</p><b class="h3">${g[2]}</b></div><button class="btn sm ghost" data-gmenu="1">← 게임 목록</button></div>`; },
  gameEnd(box, m, id, res) {
    const ok = res.filter(r => r.ok).length, wrong = [...new Set(res.filter(r => !r.ok).map(r => r.cid))].map(cid => MMData.concept(m, cid)).filter(Boolean);
    box.innerHTML = `${this.gameHead(id)}<div class="split"><div class="ring-wrap">${ringSVG(pct(ok, res.length), 200, 16)}<div class="ring-t"><b>${ok}/${res.length}</b><span>정답</span></div></div>
      <div>${wrong.length ? `<p class="small muted">다시 볼 개념 (자동으로 복습 우선순위가 올라갑니다)</p>${wrong.map(c => `<div class="citem">${this.dot(m, c.id)}<div class="ct"><b>${esc(c.term)}</b><span>${esc(c.def)}</span></div></div>`).join('')}` : '<p class="lead">모두 정답! 기억이 단단해지고 있어요.</p>'}
      <div class="row" style="margin-top:12px"><button class="btn primary" data-gplay="${id}">다시 하기</button><button class="btn" data-gmenu="1">게임 목록</button></div></div></div>`;
    animateRings(box);
  },

  /* ======================= STEP 5 WEAKNESS ======================= */

  },

      <label class="lab">문제 유형 (선택하지 않으면 난이도 기본 유형: ${D[vs.diff].map(t => TN[t]).join(', ')})</label><div class="row">${Object.keys(TN).map(t => `<button class="chip ${vs.types.includes(t) ? 'on' : ''}" data-et="${t}">${TN[t]}</button>`).join('')}</div>
