        <p class="eyebrow">해제 조건</p><div class="issue"><span>모든 필수 개념(${req.length}개) STEP 0 이해 확인</span><span class="badge ${undAll ? 'ok' : 'bad'}">${undAll ? '완료' : `${req.filter(c => S[c.id] && S[c.id].und).length}/${req.length}`}</span></div>
        <div class="issue"><span>STEP 6 시험 1회 이상 응시</span><span class="badge ${exam ? 'ok' : 'bad'}">${exam ? '완료' : '미응시'}</span></div>
        <p class="small muted">최종 시험: 원문·핵심 단어 힌트 숨김 · 정답 공개 제한 · 필수 개념 전체 범위 · 기초 회상 + 응용 혼합 · 실제 답변으로만 평가. 100%는 모든 필수 개념을 힌트 없이 회상해 검증했을 때만 표시됩니다.</p>
        <button class="btn primary big" id="fbGo" ${unlocked ? '' : 'disabled'}>${unlocked ? '최종 시험 시작' : '조건을 충족하면 해제됩니다'}</button></div></div>`;
    if (!unlocked) return;
    $('#fbGo', pin).onclick = () => {
      const box = $('#fbBox', pin), qs = shuffle(req).map(c => QGen.make(m, c.ordered ? 'order' : c.kind === 'list' ? 'typed-def' : pick(['typed-term', 'typed-def']), c));
      const app = shuffle(m.P.concepts).map(c => QGen.any(m, ['case', 'compare', 'parent'], c, 3)).filter(Boolean).slice(0, Math.min(5, Math.ceil(req.length * .25)));
      const all = shuffle(qs.concat(app)).filter(Boolean);
      box.style.background = 'rgba(0,0,0,.75)';
      this.seq(box, m, all, { src: 'final', label: 'FINAL', hints: false }, res => {
        const M2 = MMData.metrics(m), ok = res.filter(r => r.ok).length, master = M2.mastery === 100;
        box.innerHTML = `<div style="text-align:center"><svg class="svgbox" viewBox="0 0 600 300" style="max-height:34vh">${req.map((c, i) => { const a = i / req.length * Math.PI * 2, v = m.stats[c.id] && m.stats[c.id].verified, x = 300 + Math.cos(a) * 220, y = 150 + Math.sin(a) * 110; return `<line x1="300" y1="150" x2="${x}" y2="${y}" stroke="${v ? '#7fd4ff' : '#333'}" stroke-opacity=".5" stroke-dasharray="300" stroke-dashoffset="300"><animate attributeName="stroke-dashoffset" from="300" to="0" begin="${i * .05}s" dur="1s" fill="freeze"/></line><circle cx="${x}" cy="${y}" r="${v ? 7 : 4}" fill="${v ? '#bfefff' : '#555'}"/>`; }).join('')}<circle cx="300" cy="150" r="50" fill="url(#orbA)"/></svg>
          <h2 class="h1 grad" style="margin-top:10px">${master ? 'MASTERY ACHIEVED' : `${M2.mastery}%`}</h2><p class="lead" style="margin:10px auto">${master ? '"모든 필수 개념의 암기 검증을 완료했습니다."' : `최종 시험 ${ok}/${res.length} 정답. 아직 검증되지 않은 필수 개념이 ${M2.req - M2.verified}개 있습니다.`}</p>
          ${master ? '<p class="h3">ZERO TO MASTERY<br><span class="muted" style="font-size:.7em">KNOW IT. RECALL IT. MASTER IT.</span></p><p class="muted">"이해하고, 기억하고, 스스로 증명하라."</p><p class="small muted">시간이 지나면 복습 권장 상태가 될 수 있습니다 — 유지 상태는 분석 화면에서 확인하세요.</p>' : '<button class="btn primary" onclick="MMUI.go(6)">약점 파괴로 이동</button>'}</div>`;
      });
    };
  },

  /* ======================= ANALYTICS ======================= */
  v_stats(pin, m) {
    const M = MMData.metrics(m), C = m.P.concepts, S = m.stats, D = Store.data.days, ST = Store.data.mm.settings, today = D[dayKey()] || { q: 0, ok: 0, sec: 0 };
    let streak = 0; for (let k = 0; k < 400; k++) { const d = D[dayKey(Date.now() - k * 86400000)]; if (d && d.q) streak++; else if (k > 0) break; }
    const mostWrong = C.filter(c => S[c.id] && S[c.id].bad).sort((a, b) => S[b.id].bad - S[a.id].bad).slice(0, 5), ex = m.exams.slice(-8), vs = this.vs.st || (this.vs.st = { ch: null, ex: null });
    const upcoming = C.filter(c => S[c.id] && S[c.id].next).sort((a, b) => S[a.id].next - S[b.id].next).slice(0, 6), hasData = m.log.length > 0;
    const rings = [['암기 완료율', M.mastery, '#2b7bff', '#5ad1ff'], ['이해도', M.understanding, '#5ad1ff', '#5ff0c4'], ['학습 진행률', M.progress, '#8a5cff', '#d3b8ff'], ['복습 유지', M.retain, '#ffb36b', '#ffd27a']];
    pin.innerHTML = `<div class="wrap top">${this.hdr(9, 'LEARNING ANALYTICS', `${esc(m.title)} — 모든 수치는 실제 응답 기록에서 계산됩니다.`)}
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">${rings.map((r, i) => `<div class="card glass ring-wrap">${ringSVG(r[1], 150, 12, r[2], r[3], 'st' + i)}<div class="ring-t"><b style="font-size:var(--t3)">${r[1]}%</b><span>${r[0]}</span></div></div>`).join('')}</div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:14px">
        <div class="stat"><b>${M.total}</b><span>전체 개념</span></div><div class="stat"><b>${M.verified}</b><span>암기 완료 (필수 ${M.req})</span></div><div class="stat"><b>${Math.max(0, M.learning)}</b><span>학습 중</span></div><div class="stat"><b>${M.review}</b><span>복습 필요</span></div>
        <div class="stat"><b>${Math.round((m.time || 0) / 60)}분</b><span>학습 시간</span></div><div class="stat"><b>${streak}일</b><span>연속 학습</span></div><div class="stat"><b>${today.q}/${ST.dailyGoal || 30}</b><span>오늘 푼 문제 / 목표</span></div><div class="stat"><b>${M.exam == null ? '—' : M.exam + '%'}</b><span>최근 시험 정답률</span></div></div>
      ${hasData ? '' : '<div class="fb info" style="margin-top:14px">아직 학습 기록이 없습니다. 기록이 없을 때는 그래프를 임의의 데이터로 채우지 않습니다.</div>'}
      <div class="grid g2" style="margin-top:14px;align-items:start">
        <div class="card glass"><p class="eyebrow">챕터별 암기 완료율 (터치해 펼치기)</p>${m.P.chapters.map(ch => { const cs = C.filter(c => c.chapterId === ch.id && c.importance !== '보충'), v = cs.filter(c => S[c.id] && S[c.id].verified).length;
          return `<div data-sch="${ch.id}" style="cursor:pointer;margin-bottom:10px"><div class="row" style="justify-content:space-between"><span class="small">${esc(ch.name)}</span><b class="small">${v}/${cs.length}</b></div><div class="meter"><i data-w="${pct(v, cs.length)}"></i></div>
            ${vs.ch === ch.id ? `<div style="margin-top:8px">${C.filter(c => c.chapterId === ch.id).map(c => `<div class="citem" data-wi="${c.id}">${this.dot(m, c.id)}<div class="ct"><b>${esc(c.term)}</b><span>${MMData.stateLabel[MMData.state(m, c.id)]} · ${S[c.id] ? `${S[c.id].ok}/${S[c.id].att}` : '기록 없음'}</span></div></div>`).join('')}</div>` : ''}</div>`; }).join('')}</div>
        <div class="card glass"><p class="eyebrow">최근 시험 (막대를 터치)</p>${ex.length ? `<svg class="svgbox int" viewBox="0 0 420 170">${ex.map((e, i) => `<g data-sex="${m.exams.length - ex.length + i}" style="cursor:pointer"><rect x="${20 + i * 50}" y="${150 - e.rate * 1.3}" width="32" height="${Math.max(2, e.rate * 1.3)}" rx="6" fill="${i === ex.length - 1 ? '#5ad1ff' : 'rgba(90,209,255,.4)'}"><animate attributeName="height" from="0" to="${Math.max(2, e.rate * 1.3)}" dur=".8s"/><animate attributeName="y" from="150" to="${150 - e.rate * 1.3}" dur=".8s"/></rect><text x="${36 + i * 50}" y="${144 - e.rate * 1.3}" text-anchor="middle" fill="#fff" font-size="12">${e.rate}</text><text x="${36 + i * 50}" y="166" text-anchor="middle" fill="#8b909b" font-size="10">${e.diff[0]}</text></g>`).join('')}</svg>
          ${vs.ex != null && m.exams[vs.ex] ? (() => { const e = m.exams[vs.ex]; return `<div class="fb info small">${fmtDate(e.t)} · ${e.diff} · ${e.ok}/${e.n} 정답 · 미응답 ${e.skip}${e.self ? ` · 자가 확인 ${e.self}` : ''}<br>틀린 개념: ${e.wrong.map(id => esc(MMX.base((MMData.concept(m, id) || {}).term || '?'))).join(', ') || '없음'}</div>`; })() : ''}` : '<p class="muted">시험 기록 없음</p>'}
          <p class="eyebrow" style="margin-top:14px">가장 많이 틀린 개념</p>${mostWrong.map(c => `<div class="issue small" data-wi="${c.id}" style="cursor:pointer"><span>${esc(MMX.base(c.term))}</span><span class="badge bad">오답 ${S[c.id].bad}</span></div>`).join('') || '<p class="muted small">기록 없음</p>'}</div></div>
      <div class="grid g2" style="margin-top:14px;align-items:start">
        <div class="card glass"><p class="eyebrow">최근 학습 기록</p>${m.log.slice(-10).reverse().map(l => { const c = MMData.concept(m, l.cid); return `<div class="issue small"><span>${l.ok ? '✓' : '✗'} ${esc(c ? MMX.base(c.term) : '삭제된 개념')}</span><span class="muted">${{ mcq: '객관식', recall: '회상', self: '자가 확인', hint: '힌트 사용' }[l.mode] || l.mode} · ${fmtDate(l.t)}</span></div>`; }).join('') || '<p class="muted small">기록 없음</p>'}</div>
        <div class="card glass"><p class="eyebrow">다음 복습 일정</p>${upcoming.map(c => `<div class="issue small"><span>${esc(MMX.base(c.term))}</span><span class="${S[c.id].next < Date.now() ? 'badge warn' : 'muted'}">${S[c.id].next < Date.now() ? '지금 복습' : fmtDate(S[c.id].next)}</span></div>`).join('') || '<p class="muted small">일정 없음</p>'}
          <div class="fb info small" style="margin-top:10px">💡 ${this.recommend(m).html}</div></div></div></div>`;
    animateRings(pin); animateMeters(pin);
    pin.onclick = e => { const ch = e.target.closest('[data-sch]'), w = e.target.closest('[data-wi]'), x = e.target.closest('[data-sex]'), r = e.target.closest('[data-rec]');
      if (w) return this.nodeInfo(m, w.dataset.wi); if (r) return this.go(+r.dataset.rec); if (ch) { vs.ch = vs.ch === ch.dataset.sch ? null : ch.dataset.sch; return this.refresh(); } if (x) { vs.ex = +x.dataset.sex; this.refresh(); } };
  },

  /* ======================= SETTINGS ======================= */
  v_settings(pin) {
    const S = Store.data.mm.settings;
    const F = [['diff', '학습 난이도 (시험 기본값)', 'sel', [['easy', '쉬움'], ['normal', '보통'], ['hard', '어려움']]], ['fs', '글자 크기', 'rng', [.85, 1.35, .05]], ['anim', '애니메이션 속도', 'rng', [.5, 1.8, .1]], ['bg', '배경 효과 강도', 'rng', [0, 1, .1]],
      ['ttsRate', '음성 읽기 속도', 'rng', [.6, 1.6, .1]], ['gameTime', '암기 게임 제한 시간(초)', 'sel', [[5, '5'], [10, '10'], [15, '15'], [20, '20']]], ['dailyGoal', '하루 학습 목표(문제 수)', 'sel', [[10, '10'], [20, '20'], [30, '30'], [50, '50'], [100, '100']]],
      ['revMul', '복습 간격 배율', 'rng', [.5, 2, .1]], ['ansMode', '정답 표시 방식 (시험)', 'sel', [['instant', '문제마다 즉시'], ['end', '시험이 끝난 뒤']]], ['theme', '테마', 'sel', [['black', '블랙'], ['navy', '다크 네이비']]], ['sound', '소리 및 진동', 'chk'], ['reduce', '동작 줄이기', 'chk']];
    pin.innerHTML = `<div class="wrap top">${this.hdr(10, '개인 맞춤 설정', '설정은 자동으로 저장됩니다.')}<div class="card glass"><div class="grid g2">${F.map(([k, n, t, o]) => `<div><label class="lab">${n} ${t === 'rng' ? `<b id="sv_${k}">${(+S[k]).toFixed(2)}</b>` : ''}</label>
      ${t === 'sel' ? `<select class="field" data-s="${k}">${o.map(x => `<option value="${x[0]}" ${String(S[k]) === String(x[0]) ? 'selected' : ''}>${x[1]}</option>`).join('')}</select>` : t === 'rng' ? `<input type="range" data-s="${k}" min="${o[0]}" max="${o[1]}" step="${o[2]}" value="${S[k]}">` : `<button class="chip ${S[k] ? 'on' : ''}" data-tg="${k}">${S[k] ? '켜짐' : '꺼짐'}</button>`}</div>`).join('')}</div>
      <div class="sep"></div><p class="eyebrow">원하는 챕터·개념 직접 복습</p><p class="small muted">분석 화면의 챕터를 펼치거나 유니버스에서 개념을 터치하면 정보를 볼 수 있고, STEP 0·1에서 개념을 직접 골라 학습할 수 있습니다.</p>
      <div class="sep"></div><div class="row"><button class="btn danger" id="allReset">이 기기의 모든 기록 초기화</button><span class="small muted">저장 상태: ${Store.ok === false ? '저장 실패(공간 부족 또는 차단)' : '정상'}</span></div></div></div>`;
    pin.oninput = e => { const r = e.target.closest('input[data-s]'); if (r) { S[r.dataset.s] = +r.value; $('#sv_' + r.dataset.s, pin).textContent = (+r.value).toFixed(2); applySettings(); Store.save(); } };
    pin.onchange = e => { const s = e.target.closest('select[data-s]'); if (s) { S[s.dataset.s] = isNaN(+s.value) ? s.value : +s.value; applySettings(); Store.save(); toast('저장했습니다.'); } };
    pin.onclick = async e => { const t = e.target.closest('[data-tg]'); if (t) { S[t.dataset.tg] = !S[t.dataset.tg]; applySettings(); Store.save(); return this.refresh(); }
      if (e.target.closest('#allReset') && await confirmBox('협상 수업과 암기 마스터의 모든 자료·기록·설정을 지우고 처음 상태로 되돌릴까요?', '모두 초기화')) { try { localStorage.removeItem(Store.key); } catch (er) { } location.reload(); } };
  }
});

</script>
<script>
/* ---- js/main.js ---- */
/* ============ BOOT ============ */
'use strict';
const SET_DEFAULTS = { diff: 'normal', fs: 1, anim: 1, bg: 1, ttsRate: 1, gameTime: 10, dailyGoal: 30, revMul: 1, ansMode: 'instant', theme: 'black', sound: true, reduce: false };
function applySettings() {
  const S = Store.data.mm.settings;
  document.documentElement.style.setProperty('--fs', S.fs);
  App.speedMul = S.anim; App.reduce = !!S.reduce;
  document.body.classList.toggle('reduce', App.reduce);
  document.body.classList.toggle('theme-navy', S.theme === 'navy');
  if (BG.intensity !== S.bg) { BG.intensity = S.bg; BG.resize(); }
}
function setMode(mode) {
  App.mode = mode; Store.data.mode = mode; Store.save();
  $('#lesson').classList.toggle('on', mode === 'lesson'); $('#mm').classList.toggle('on', mode === 'mm');
  $$('.mode-btn').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  Actors.provider = mode === 'lesson' ? () => Lesson.actors() : () => ({ op: 0 });
  $('#sceneLabel').textContent = ''; Lesson.updateDots();
  if (mode === 'mm') MMUI.refresh();
}
(function boot() {
  Store.load();
  const S = Store.data.mm.settings; for (const k in SET_DEFAULTS) if (S[k] === undefined) S[k] = SET_DEFAULTS[k];
  if (S.reduce === false && window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches && !Store.data._rm) { S.reduce = true; Store.data._rm = 1; }
  setQuality(2); BG.init(); Actors.init(); applySettings();
  Lesson.init(); MMUI.init();
  $('#topbar').addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if (b) setMode(b.dataset.mode); });
  setMode(Store.data.mode || 'lesson');
  // study time: count only while the learner is actually active
  let lastAct = Date.now(); ['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, () => lastAct = Date.now(), { passive: true }));
  setInterval(() => {
    if (document.hidden || App.mode !== 'mm' || Date.now() - lastAct > 60000) return;
    const m = MMData.cur(); if (!m) return; m.time = (m.time || 0) + 15;
    const d = Store.data.days[dayKey()] || (Store.data.days[dayKey()] = { q: 0, ok: 0, sec: 0 }); d.sec += 15; Store.save();
  }, 15000);
  // fullscreen (Chrome / Samsung Internet / Android; iPad Safari via webkit prefix where supported)
  const fsb = $('#fsBtn'), de = document.documentElement;
  const canFs = !!(de.requestFullscreen || de.webkitRequestFullscreen);
  if (!canFs) fsb.hidden = true;
  const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  fsb.onclick = () => { try { if (isFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document); else { const r = (de.requestFullscreen || de.webkitRequestFullscreen).call(de); if (r && r.catch) r.catch(() => toast('이 브라우저에서는 전체 화면을 사용할 수 없습니다.')); } } catch (e) { toast('이 브라우저에서는 전체 화면을 사용할 수 없습니다.'); } };
  const fsSync = () => { fsb.textContent = isFs() ? '✕' : '⛶'; fsb.title = isFs() ? '전체 화면 종료' : '전체 화면'; setTimeout(() => { App.W = innerWidth; App.H = innerHeight; BG.resize(); }, 120); };
  document.addEventListener('fullscreenchange', fsSync); document.addEventListener('webkitfullscreenchange', fsSync);
  addEventListener('orientationchange', () => setTimeout(() => { App.W = innerWidth; App.H = innerHeight; BG.resize(); }, 250));
  document.addEventListener('gesturestart', e => e.preventDefault());
  window.__ready = true;
})();

</script>
</body>
</html>
