<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#03050B">
<title>EARTHFLOW — The Art of Earth Science</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --space:#03050B; --navy:#091423; --white:#F5F7FA; --blue:#188BFF; --cyan:#68D5FF;
  --warm:#FF784F; --cold:#39B9F5; --gold:#D5A468;
  --dim:rgba(245,247,250,.62); --faint:rgba(245,247,250,.38);
  --spring: cubic-bezier(.2,1.3,.3,1);
  --ease: cubic-bezier(.22,.8,.2,1);
  --font: "Inter","Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--space);color:var(--white);font-family:var(--font);overflow:hidden;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
canvas#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
#ui .hit{pointer-events:auto}
button{font-family:var(--font);color:var(--white);border:0;background:none;cursor:pointer;-webkit-appearance:none}

/* ---------- Liquid glass ---------- */
.glass{
  background:linear-gradient(140deg,rgba(255,255,255,.115),rgba(255,255,255,.035) 46%,rgba(255,255,255,.06));
  -webkit-backdrop-filter:blur(26px) saturate(165%);backdrop-filter:blur(26px) saturate(165%);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.04),0 24px 60px rgba(0,0,0,.38);
  border-radius:24px;position:relative;
}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 60% at 18% 0%,rgba(255,255,255,.14),transparent 55%);mix-blend-mode:screen;opacity:.7}
.pop{transition:transform .62s var(--spring),opacity .35s var(--ease),filter .45s var(--ease)}
.pop.off{opacity:0;transform:translateY(18px) scale(.965);filter:blur(10px);pointer-events:none!important}

/* ---------- Top HUD ---------- */
#hud-top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:calc(env(safe-area-inset-top) + 26px) 36px 0 44px}
#chapter{display:flex;flex-direction:column;gap:5px;transition:opacity .5s}
#chapter .ch-num{font-size:12px;letter-spacing:.28em;color:var(--cyan);font-weight:600}
#chapter .ch-name{font-size:13px;letter-spacing:.32em;font-weight:500;color:var(--white)}
#chapter .ch-ko{font-size:13px;color:var(--faint);letter-spacing:.02em}
#brand{font-size:11px;letter-spacing:.42em;color:var(--faint);font-weight:500;margin-top:4px}
#top-right{display:flex;gap:10px;align-items:center}
.icon-btn{width:46px;height:46px;border-radius:23px;display:grid;place-items:center;transition:transform .4s var(--spring),background .3s}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:20px;height:20px;stroke:var(--white);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.on{background:rgba(104,213,255,.22)}

/* ---------- Titles ---------- */
#titles{position:absolute;inset:0}
.tblock{position:absolute;left:44px;top:18vh;max-width:min(36vw,560px);transition:opacity .8s var(--ease),filter .8s var(--ease),transform .9s var(--ease)}
.tblock.center{left:50%;top:auto;bottom:15vh;transform:translateX(-50%);text-align:center;max-width:82vw;width:max-content}
.tblock .tn{font-size:12px;letter-spacing:.3em;color:var(--faint);font-weight:500;margin-bottom:16px}
.tblock h1{font-size:clamp(34px,3.7vw,62px);line-height:1.08;font-weight:600;letter-spacing:-.025em;margin:0 0 18px;text-shadow:0 2px 40px rgba(0,0,0,.55)}
.tblock p{text-shadow:0 1px 18px rgba(0,0,0,.7)}
.tblock.center h1{font-size:clamp(40px,4.6vw,78px)}
.tblock p{font-size:clamp(16px,1.35vw,20px);line-height:1.62;color:var(--dim);margin:0;font-weight:400;letter-spacing:-.005em;white-space:pre-line}
.tblock .line{display:block;opacity:0;transform:translateY(26px);filter:blur(14px);transition:opacity .9s var(--ease),transform 1.05s var(--spring),filter .9s var(--ease)}
.tblock.in .line{opacity:1;transform:none;filter:none}
.tblock.out{opacity:0;filter:blur(18px);transform:translateY(-34px)}
.tblock.center.out{transform:translate(-50%,-34px)}
.tblock .memo{margin-top:22px;padding:14px 18px;border-radius:16px;font-size:15px;line-height:1.55;color:var(--white);
  background:rgba(24,139,255,.12);border:1px solid rgba(104,213,255,.25)}
.tblock .memo b{color:var(--cyan);font-weight:600;font-size:12px;letter-spacing:.18em;display:block;margin-bottom:4px}
.kw{color:var(--cyan);font-weight:500}
.kw.w{color:var(--warm)}
.kw.g{color:var(--gold)}

/* ---------- Panels ---------- */
#panels{position:absolute;inset:0}
.panel{position:absolute;padding:20px 22px;pointer-events:auto;min-width:240px}
.panel h3{margin:0 0 12px;font-size:12px;letter-spacing:.24em;color:var(--faint);font-weight:600}
.panel .row{display:flex;justify-content:space-between;gap:18px;font-size:15px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.panel .row:last-child{border:0}
.panel .row span:first-child{color:var(--dim)}
.panel .note{font-size:12.5px;color:var(--faint);line-height:1.5;margin-top:10px}
.slider{width:100%;margin:6px 0 4px;position:relative;height:44px;display:flex;align-items:center;touch-action:none}
.slider .track{position:absolute;left:0;right:0;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.slider .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:3px}
.slider .knob{position:absolute;width:30px;height:30px;border-radius:15px;margin-left:-15px;background:#fff;
  box-shadow:0 4px 16px rgba(0,0,0,.4),0 0 0 6px rgba(104,213,255,.18);transition:transform .35s var(--spring)}
.slider.drag .knob{transform:scale(1.18)}
.slabel{display:flex;justify-content:space-between;font-size:14px;color:var(--dim)}
.slabel b{color:var(--white);font-weight:600;font-variant-numeric:tabular-nums}
.seg{display:flex;padding:4px;border-radius:16px;background:rgba(0,0,0,.25);position:relative;gap:2px}
.seg button{flex:1;padding:11px 16px;font-size:14px;font-weight:600;letter-spacing:.06em;border-radius:12px;position:relative;z-index:1;color:var(--dim);transition:color .3s}
.seg button.on{color:var(--space)}
.seg .thumb{position:absolute;top:4px;bottom:4px;border-radius:12px;background:var(--white);transition:left .55s var(--spring),width .55s var(--spring)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;font-size:14px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);transition:background .3s,border-color .3s,transform .4s var(--spring);color:var(--white)}
.chip:active{transform:scale(.95)}
.chip.on{background:rgba(104,213,255,.18);border-color:rgba(104,213,255,.55)}
.chip.on.warm{background:rgba(255,120,79,.18);border-color:rgba(255,120,79,.6)}
.chip .dot{width:8px;height:8px;border-radius:4px;background:currentColor;opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;font-size:15px}
.sw{width:50px;height:30px;border-radius:15px;background:rgba(255,255,255,.14);position:relative;transition:background .3s;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:transform .45s var(--spring)}
.toggle.on .sw{background:var(--blue)}
.toggle.on.warm .sw{background:var(--warm)}
.toggle.on .sw::after{transform:translateX(20px)}
.chain{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.chain .st{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--faint);padding:6px 0;transition:color .5s}
.chain .st i{width:22px;height:22px;border-radius:11px;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;font-style:normal;font-size:11px;transition:all .5s var(--spring)}
.chain .st.on{color:var(--white)}
.chain .st.on i{background:var(--warm);border-color:var(--warm);color:#fff;transform:scale(1.1)}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}
.bar>div{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--warm));transition:width .5s var(--ease)}
.cmp{display:grid;grid-template-columns:1.05fr 1fr 1fr;font-size:13.5px;gap:0}
.cmp div{padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.06);transition:color .5s,background .5s}
.cmp .hd{font-size:11px;letter-spacing:.2em;color:var(--faint);font-weight:600}
.cmp .k{color:var(--dim)}
.cmp .act{color:var(--white);background:rgba(255,255,255,.05)}
.cmp .act.wm{color:#ffb39a}
.cmp .na{color:rgba(245,247,250,.28)}

/* ---------- 3D labels ---------- */
#labels{position:absolute;inset:0}
.lab{position:absolute;left:0;top:0;transform:translate(-9999px,0);white-space:nowrap;font-size:13.5px;font-weight:500;
  transition:opacity .45s var(--ease);will-change:transform;display:flex;align-items:center;gap:7px}
.lab .pin{width:7px;height:7px;border-radius:4px;background:var(--white);box-shadow:0 0 12px currentColor;flex:none}
.lab .tx{padding:5px 10px;border-radius:10px;background:rgba(3,5,11,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.1)}
.lab .tx small{display:block;font-size:11px;color:var(--faint);font-weight:400}
.lab.warm{color:var(--warm)} .lab.warm .tx{border-color:rgba(255,120,79,.4)}
.lab.cold{color:var(--cold)} .lab.cold .tx{border-color:rgba(57,185,245,.45)}
.lab.gold{color:var(--gold)} .lab.gold .tx{border-color:rgba(213,164,104,.45)}
.lab.big .tx{font-size:16px;font-weight:600;padding:7px 13px}
.lab.plain .tx{background:none;border:0;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0;color:var(--dim);font-size:12px;letter-spacing:.08em}
.lab.plain .pin{display:none}
.lab.tap{pointer-events:auto}
.lab.sel .tx{background:rgba(24,139,255,.35);border-color:var(--cyan)}

/* ---------- Info card ---------- */
#info{position:absolute;right:120px;bottom:118px;width:min(380px,34vw);padding:22px 24px 20px;pointer-events:auto}
#info .tag{display:inline-block;font-size:11px;letter-spacing:.2em;font-weight:600;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.1);margin-right:6px}
#info .tag.warm{background:rgba(255,120,79,.22);color:#ffb39a}
#info .tag.cold{background:rgba(57,185,245,.22);color:#9fdcff}
#info h2{margin:12px 0 8px;font-size:26px;letter-spacing:-.02em;font-weight:600}
#info p{margin:0;font-size:15px;line-height:1.6;color:var(--dim)}
#info .x{position:absolute;right:12px;top:12px}

/* ---------- Nav zones ---------- */
.nav{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;width:10vw;transition:opacity .4s}
#nav-left{left:0} #nav-right{right:0;width:14vw}
#nav-left .chev{left:8px} #nav-right .chev{right:8px}
.chev{position:absolute;top:calc(50% - 42px);width:30px;height:84px;border-radius:15px;display:grid;place-items:center;font-size:24px;font-weight:300;color:var(--dim);
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);transition:transform .5s var(--spring),background .3s}
#nav-right .chev{flex-direction:column}
.nav-next{position:absolute;right:46px;top:calc(50% - 8px);font-size:11px;letter-spacing:.12em;color:var(--faint);text-align:right;white-space:nowrap;line-height:1.4}
.nav.flash .chev{transform:scale(1.22);background:rgba(104,213,255,.25)}
.nav.hidden{opacity:0}

/* ---------- Dock & progress ---------- */
#dock{position:absolute;left:36px;bottom:calc(env(safe-area-inset-bottom) + 26px);display:flex;gap:4px;padding:6px;border-radius:30px;pointer-events:auto}
#dock .icon-btn{width:52px;height:52px;border-radius:26px}
#dock .icon-btn span{position:absolute;bottom:-22px;font-size:10.5px;letter-spacing:.06em;color:var(--faint);white-space:nowrap}
#dock .icon-btn{position:relative}
#review-btn.hide{display:none}
#progress{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 34px);display:flex;gap:14px;align-items:center;
  padding:12px 18px;border-radius:22px;pointer-events:auto}
#progress .grp{display:flex;gap:6px;align-items:center}
#progress .d{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.22);transition:width .6s var(--spring),background .4s;position:relative}
#progress .d::after{content:"";position:absolute;inset:-14px -4px}
#progress .d.done{background:rgba(255,255,255,.5)}
#progress .d.cur{width:30px;background:var(--cyan)}
#progress .ct{font-size:12px;color:var(--faint);letter-spacing:.12em;font-variant-numeric:tabular-nums;min-width:48px;text-align:right}

/* ---------- Modal sheets ---------- */
.modal{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);width:min(860px,76vw);max-height:72vh;overflow:auto;padding:30px 34px;pointer-events:auto}
.modal.off{transform:translate(-50%,30px) scale(.97)}
.modal .x{position:absolute;right:16px;top:16px}
.modal h2{margin:4px 0 20px;font-size:30px;letter-spacing:-.02em;font-weight:600}
.modal .eyebrow{font-size:12px;letter-spacing:.26em;color:var(--cyan);font-weight:600}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cbox{padding:16px 18px;border-radius:18px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07)}
.cbox b{display:block;font-size:11.5px;letter-spacing:.22em;color:var(--faint);margin-bottom:8px;font-weight:600}
.cbox div{font-size:15.5px;line-height:1.62;color:var(--white)}
.cbox.memo{grid-column:1/-1;background:rgba(24,139,255,.12);border-color:rgba(104,213,255,.3)}
.cbox.memo b{color:var(--cyan)}
.cbox ul{margin:0;padding-left:18px} .cbox li{margin:3px 0}
.q h4{font-size:21px;font-weight:500;margin:6px 0 18px;line-height:1.45;letter-spacing:-.01em}
.q .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q .opt{text-align:left;padding:16px 18px;border-radius:16px;font-size:15.5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  transition:background .35s,border-color .35s,transform .45s var(--spring)}
.q .opt:active{transform:scale(.97)}
.q .opt.right{background:rgba(24,139,255,.22);border-color:var(--cyan)}
.q .opt.wrong{background:rgba(255,120,79,.14);border-color:rgba(255,120,79,.5)}
.q .exp{margin-top:18px;font-size:15.5px;line-height:1.65;color:var(--dim);padding:16px 18px;border-radius:16px;background:rgba(255,255,255,.04)}
.q .exp b{color:var(--white)}
.q .foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;color:var(--faint);font-size:13px}
.pill{padding:12px 20px;border-radius:16px;background:rgba(255,255,255,.1);font-size:14.5px;font-weight:600;pointer-events:auto}
.pill.primary{background:var(--white);color:var(--space)}

#memo-big{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity .5s,filter .6s,transform .8s var(--spring);filter:blur(12px)}
#memo-big.on{opacity:1;filter:none;transform:translate(-50%,-50%) scale(1)}
#memo-big .n{font-size:clamp(20px,1.8vw,28px);font-weight:600;letter-spacing:.02em}
#memo-big .v{font-size:clamp(70px,8vw,140px);font-weight:700;letter-spacing:-.04em;line-height:1;margin-top:6px;
  background:linear-gradient(180deg,#fff,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}

#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 28px);transform:translate(-50%,-14px);padding:12px 20px;border-radius:16px;font-size:14px;opacity:0;transition:opacity .4s,transform .6s var(--spring)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#resume{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:30px 34px;width:min(460px,80vw);pointer-events:auto;text-align:center}
#resume.off{transform:translate(-50%,-46%) scale(.96)}
#resume h3{font-size:24px;margin:8px 0 10px;font-weight:600;letter-spacing:-.02em}
#resume p{color:var(--dim);margin:0 0 22px;font-size:15px;line-height:1.55}
#resume .btns{display:flex;gap:10px;justify-content:center}
.ripple{position:absolute;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;border:1.5px solid rgba(104,213,255,.75);
  animation:rip .7s var(--ease) forwards;pointer-events:none}
@keyframes rip{from{transform:scale(.2);opacity:1}to{transform:scale(1.4);opacity:0}}
#concept-note{position:absolute;right:36px;bottom:calc(env(safe-area-inset-bottom) + 38px);font-size:11.5px;color:var(--faint);letter-spacing:.04em;max-width:24vw;text-align:right;line-height:1.45;transition:opacity .5s}
#observe-hint{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 28px);transform:translateX(-50%);padding:11px 18px;border-radius:16px;font-size:13.5px;color:var(--dim)}
#fatal{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:40px;z-index:9;color:var(--dim);font-size:16px;line-height:1.7}
.ui-dim #titles,.ui-dim #panels,.ui-dim #chapter{opacity:.12;transition:opacity .6s}
#titles,#panels{transition:opacity .6s}
.tblock.top{top:calc(env(safe-area-inset-top) + 96px);max-width:min(40vw,600px)}
.tblock.top h1{font-size:clamp(28px,2.7vw,46px);margin-bottom:10px}
.tblock.top .tn{margin-bottom:10px}
.tblock.def{bottom:auto;top:13vh;max-width:min(80vw,1180px);padding:26px 40px 30px;border-radius:32px;background:radial-gradient(70% 80% at 50% 45%,rgba(3,5,11,.72),rgba(3,5,11,.35) 70%,transparent)}
.tblock.def .defh{font-size:clamp(24px,2.45vw,42px);line-height:1.45;font-weight:500;color:rgba(245,247,250,.78);letter-spacing:-.02em}
.tblock.def .dk{font-weight:700;color:#fff}
.term{color:rgba(245,247,250,.78);background:linear-gradient(var(--warm),var(--warm)) no-repeat 0 96%/0% 3px;transition:color .7s,background-size 1s var(--ease),text-shadow .7s;padding-bottom:2px}
.term.on{color:#fff;background-size:100% 3px;text-shadow:0 0 28px rgba(255,120,79,.55)}
.terms{display:flex;gap:10px;justify-content:center;margin-top:26px;flex-wrap:wrap}
.tchip{opacity:.28;transition:opacity .6s,transform .7s var(--spring),background .5s,border-color .5s;transform:translateY(8px) scale(.96)}
.tchip i{font-style:normal;width:22px;height:22px;border-radius:11px;display:inline-grid;place-items:center;background:rgba(255,255,255,.12);font-size:12px}
.tchip.on{opacity:1;transform:none;background:rgba(255,120,79,.16);border-color:rgba(255,120,79,.55)}
.tchip.on i{background:var(--warm)}
.lab.l{flex-direction:row-reverse}
.tblock.final{bottom:11vh;padding:26px 60px 30px;border-radius:40px;background:radial-gradient(60% 75% at 50% 55%,rgba(3,5,11,.66),rgba(3,5,11,.25) 70%,transparent)}
.tblock.final h1{font-size:clamp(46px,5.4vw,92px);letter-spacing:-.035em}
.tblock.final p{font-size:clamp(17px,1.6vw,24px);color:var(--white);letter-spacing:.04em}
.flow{display:flex;flex-wrap:wrap;gap:6px 4px;align-items:center}
.flow .chip{padding:8px 11px;font-size:13px}
.flow .ar{color:var(--faint);font-size:13px}
@media (max-width:900px){ .tblock{max-width:70vw;top:14vh} #info{right:20px;width:70vw} .modal{width:92vw;padding:22px} .q .opts,.cgrid{grid-template-columns:1fr} #concept-note{display:none} }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <div id="labels"></div>
  <div id="titles"></div>
  <div id="panels"></div>
  <div id="memo-big"><div class="n"></div><div class="v"></div></div>
  <div id="hud-top">
    <div id="chapter"><span class="ch-num"></span><span class="ch-name"></span><span class="ch-ko"></span></div>

function prepCurrent(c) {
  const p = c.pts.map(q => q.slice());
  for (let i = 1; i < p.length; i++) { while (p[i][0] - p[i - 1][0] > 180) p[i][0] -= 360; while (p[i][0] - p[i - 1][0] < -180) p[i][0] += 360; }
  if (c.loop) p.push([p[0][0] + 360, p[0][1]]);
  const seg = [0]; let tot = 0;
  for (let i = 1; i < p.length; i++) { const dl = (p[i][0] - p[i - 1][0]) * Math.cos((p[i][1] + p[i - 1][1]) / 2 * D2R), dp = p[i][1] - p[i - 1][1]; tot += Math.hypot(dl, dp); seg.push(tot); }
  const N = 200, lon = new Float32Array(N), lat = new Float32Array(N);
  let j = 0;
  for (let k = 0; k < N; k++) {
    const s = tot * k / (N - 1); while (j < seg.length - 2 && seg[j + 1] < s) j++;
    const t = (s - seg[j]) / Math.max(1e-6, seg[j + 1] - seg[j]);
    lon[k] = lerp(p[j][0], p[j + 1][0], t); lat[k] = lerp(p[j][1], p[j + 1][1], t);
  }
  // smooth (Chaikin-like box filter) for organic curves
  for (let it = 0; it < 3; it++) for (let k = 1; k < N - 1; k++) { lon[k] = (lon[k - 1] + 2 * lon[k] + lon[k + 1]) / 4; lat[k] = (lat[k - 1] + 2 * lat[k] + lat[k + 1]) / 4; }
  c.lon = lon; c.lat = lat; c.N = N; c.len = tot;
  const m = (N / 2) | 0; c.mid = [lat[m], lon[m]];
}

function mkSlider({ min, max, value, step = 1, label, fmt, onInput }) {
  const w = el('div'); w.innerHTML = `<div class="slabel"><span>${label}</span><b></b></div><div class="slider hit"><div class="track"><div class="fill"></div></div><div class="knob"></div></div>`;
  const sl = w.querySelector('.slider'), fill = w.querySelector('.fill'), knob = w.querySelector('.knob'), out = w.querySelector('b');
  let v = value;
  const draw = () => { const f = (v - min) / (max - min); fill.style.width = f * 100 + '%'; knob.style.left = f * 100 + '%'; out.textContent = fmt ? fmt(v) : v; };
  const setX = x => { const r = sl.getBoundingClientRect(); let f = clamp((x - r.left) / r.width, 0, 1); v = Math.round((min + f * (max - min)) / step) * step; draw(); onInput(v); };
  sl.addEventListener('pointerdown', e => { e.stopPropagation(); sl.setPointerCapture(e.pointerId); sl.classList.add('drag'); setX(e.clientX); });
  sl.addEventListener('pointermove', e => { if (sl.hasPointerCapture(e.pointerId)) setX(e.clientX); });
  const up = e => { sl.classList.remove('drag'); };
  sl.addEventListener('pointerup', up); sl.addEventListener('pointercancel', up);
  draw(); w.set = nv => { v = nv; draw(); }; return w;
}
function mkSeg(opts, idx, onChange) {
  const w = el('div', 'seg hit'); const th = el('div', 'thumb'); w.appendChild(th);
  const bs = opts.map((o, i) => { const b = el('button', '', o); b.onclick = e => { e.stopPropagation(); sel(i); onChange(i); }; w.appendChild(b); return b; });
  const sel = i => { bs.forEach((b, j) => b.classList.toggle('on', j === i)); requestAnimationFrame(() => { th.style.left = bs[i].offsetLeft + 'px'; th.style.width = bs[i].offsetWidth + 'px'; }); };
  sel(idx); w.sel = sel; return w;
}
function mkToggle(label, on, onChange, cls = '') {
  const t = el('div', 'toggle hit ' + cls + (on ? ' on' : ''), `<span>${label}</span><div class="sw"></div>`);
  t.onclick = e => { e.stopPropagation(); on = !on; t.classList.toggle('on', on); onChange(on); };
  t.set = v => { on = v; t.classList.toggle('on', on); }; return t;
}

function clearDemo() { APP.demo = null; APP.selCur = null; APP.selCurName = null; if (RV.prevCauses) Object.assign(DES.causes, RV.prevCauses); applyParams(); }
function closeModals(silent) {
  let any = false;

  if (APP.demo) clearDemo();

}
function runMemo() {
  const s = SC[APP.i]; if (!s.memoSeq || APP.memoRun) return;
  APP.memoRun = true; const box = $('#memo-big');
  const steps = s.memoSeq === 'cells'
    ? CELLS.map((c, i) => ({ n: c.name, v: c.range.replace('위도 ', ''), d: { cellA0: i === 0 ? 1 : .1, cellA1: i === 1 ? 1 : .1, cellA2: i === 2 ? 1 : .1, band: [c.lat0, c.lat1] } }))
    : WIND_INFO.map((w, i) => ({ n: w.name, v: w.range.replace('위도 ', ''), d: { beltA0: i === 0 ? 1 : .1, beltA1: i === 1 ? 1 : .1, beltA2: i === 2 ? 1 : .1, band: [CELLS[i].lat0, CELLS[i].lat1] } }));
  hideInfo(); $('#titles').style.opacity = .15; $('#panels').style.opacity = .15;
  steps.forEach((st, i) => later(i * 2100, () => { APP.demo = st.d; applyParams(); box.querySelector('.n').textContent = st.n; box.querySelector('.v').textContent = st.v; box.classList.remove('on'); void box.offsetWidth; box.classList.add('on'); }));
  later(steps.length * 2100, () => { box.classList.remove('on'); APP.demo = null; applyParams(); APP.memoRun = false; $('#titles').style.opacity = ''; $('#panels').style.opacity = ''; });
  APP.timers.push(later(steps.length * 2100 + 10, () => { APP.memoRun = false; }));

function toggleObserve() {

  $('#ui').classList.toggle('ui-dim', APP.observe); $('#observe-btn').classList.toggle('on', APP.observe);
  $('#observe-hint').classList.toggle('off', !APP.observe);

/* ---------------- input ---------------- */
const PTR = new Map(); let G = null;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  PTR.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (PTR.size === 1) { G = { type: 'pending', x0: e.clientX, y0: e.clientY, t0: performance.now(), lx: e.clientX, ly: e.clientY, lt: performance.now(), vx: 0, vy: 0 }; }
  else if (PTR.size === 2) { const [a, b] = [...PTR.values()]; G = { type: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y), z0: APP.oZoom.v }; }
});
canvas.addEventListener('pointermove', e => {
  if (!PTR.has(e.pointerId)) return; PTR.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!G) return;
  if (G.type === 'pinch' && PTR.size === 2) { const [a, b] = [...PTR.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); const z = clamp(G.z0 * G.d0 / Math.max(20, d), .55, 1.8); APP.oZoom.v = APP.oZoom.t = z; return; }
  if (G.type === 'pending' && Math.hypot(e.clientX - G.x0, e.clientY - G.y0) > 9) G.type = 'drag';
  if (G.type === 'drag') {
    const now = performance.now(), dx = e.clientX - G.lx, dy = e.clientY - G.ly, dtm = Math.max(1, now - G.lt);
    const k = .0042 / Math.max(.6, APP.oZoom.v);
    APP.oAz.v -= dx * k; APP.oAz.t = APP.oAz.v; APP.oAz.vel = 0;
    APP.oEl.v = clamp(APP.oEl.v + dy * k * .8, -1.1 - C.el.v, 1.15 - C.el.v); APP.oEl.t = APP.oEl.v; APP.oEl.vel = 0;
    G.vx = lerp(G.vx, -dx * k / dtm * 1000, .5); G.vy = lerp(G.vy, dy * k * .8 / dtm * 1000, .5);
    G.lx = e.clientX; G.ly = e.clientY; G.lt = now;
  }
});
const endPtr = e => {
  if (!PTR.has(e.pointerId)) return; PTR.delete(e.pointerId);
  if (G && G.type === 'pending' && PTR.size === 0 && performance.now() - G.t0 < 500) onTap(e.clientX, e.clientY);
  if (G && G.type === 'drag' && PTR.size === 0) { APP.oAz.t = APP.oAz.v + G.vx * .38; APP.oEl.t = clamp(APP.oEl.v + G.vy * .3, -1.1 - C.el.v, 1.15 - C.el.v); }
  if (PTR.size === 0) G = null;
};
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e => { e.preventDefault(); APP.oZoom.t = clamp(APP.oZoom.t * Math.exp(e.deltaY * .0012), .55, 1.8); }, { passive: false });
function onTap(x, y) {
  ripple(x, y);
  if (!$('#resume').classList.contains('off')) { $('#resume').classList.add('off'); return; }
  if (APP.modal) { closeModals(); return; }
  if (pickAt(x, y)) return;
  const W = cssW();
  if (!APP.observe && x > W * .82) { next(); return; }
  if (!APP.observe && x < W * .12) { prev(); return; }
  if (!$('#info').classList.contains('off')) hideInfo(true);
}
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
  else if (e.key === 'Escape') { closeModals(); hideInfo(true); }
});
$('#concept-btn').onclick = e => { e.stopPropagation(); APP.modal === 'concept' ? closeModals() : (closeModals(), openConcept()); };
$('#review-btn').onclick = e => { e.stopPropagation(); closeModals(); const s = SC[APP.i]; openReview(s.review != null ? s.review : s.ch); };
$('#memo-btn').onclick = e => { e.stopPropagation(); runMemo(); };
$('#observe-btn').onclick = e => { e.stopPropagation(); toggleObserve(); };
$('#btn-full').onclick = e => {
  e.stopPropagation();
  try { if (document.fullscreenElement) document.exitFullscreen(); else { const r = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (r && r.catch) r.catch(() => toast('이 화면에서는 전체 화면을 사용할 수 없어요')); } } catch (er) { toast('이 화면에서는 전체 화면을 사용할 수 없어요'); }
};

/* ---------------- frame ---------------- */
let W = 0, H = 0;
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2) * APP.q;
  const w = Math.round(cssW() * dpr), h = Math.round(cssH() * dpr);
  if (w === W && h === H) return; W = w; H = h; canvas.width = w; canvas.height = h; resizeTargets(w, h); APP.dpr = dpr;
}
addEventListener('resize', () => { resize(); const s = SC[APP.i]; });
function adaptQuality(dt) {
  APP.perfAcc += dt; APP.perfN++;
  if (APP.perfAcc > 1.2) {
    const avg = APP.perfAcc / APP.perfN; APP.perfAcc = 0; APP.perfN = 0;
    let q = APP.q;
    if (avg > 1 / 42 && q > .5) q = Math.max(.5, q - .1); else if (avg < 1 / 70 && q < 1) q = Math.min(1, q + .05);
    if (q !== APP.q) { APP.q = q; resize(); }
    APP.lowPower = APP.q < .66;
  }
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(window.EF_MAXDT || .05, Math.max(.001, (now - (APP.last || now)) / 1000 || .016)); APP.last = now;
  if (!window.EF_FIXQ) adaptQuality(dt);
  APP.time += dt;
  const ts = clamp(APP.tsS.step(dt), 0, 1); APP.simTime += dt * ts;
  const s = SC[APP.i], t = APP.time - APP.t0;
  if (s.update) s.update(APP, t);
  if (APP.demo) for (const k in APP.demo) if (P[k]) P[k].t = APP.demo[k];
  // gate morphs until the planet has turned to the right place
  const rotErr = APP.spin == null ? Math.abs(APP.rot.t - APP.rot.v) : 9;
  P.slab.t = s.slab && rotErr < .5 ? 1 : 0; P.terr.t = s.terr && rotErr < .5 ? 1 : 0;
  for (const k in P) P[k].step(dt);
  for (const k in C) C[k].step(dt);
  APP.oAz.step(dt); APP.oEl.step(dt); APP.oZoom.step(dt);
  for (const k in APP.elS) { APP.elS[k].step(dt); APP.el[k] = APP.elS[k].v * (APP.iso && APP.iso !== k ? .15 : 1); }
  APP.tradeEff = lerp(1, .22, P.k.v);
  // planet rotation
  if (APP.spin != null) { APP.rotVel = lerp(APP.rotVel, APP.spin * ts, Math.min(1, dt * 1.5)); APP.rot.v += APP.rotVel * dt; APP.rot.t = APP.rot.v; APP.rot.vel = APP.rotVel; }
  else APP.rot.step(dt);
  const away = Math.max(P.slab.v, P.terr.v), esc = 1 - .5 * away, ectr = [1.9 * away, 1.25 * away, -5.2 * away];
  const E = M4.trsY(ectr[0], ectr[1], ectr[2], esc, APP.rot.v);
  // camera
  const az = C.az.v + APP.oAz.v, elv = clamp(C.el.v + APP.oEl.v, -1.25, 1.3), dist = C.dist.v * APP.oZoom.v;
  const look = [C.lx.v, C.ly.v, C.lz.v];
  const eye = V3.add(look, [Math.cos(elv) * Math.sin(az) * dist, Math.sin(elv) * dist, Math.cos(elv) * Math.cos(az) * dist]);
  const asp = cssW() / cssH(), shift = C.shift.v * clamp((asp - 1) / .5, 0, 1);
  const view = M4.lookAt(eye, look, [0, 1, 0]), proj = M4.persp(C.fov.v * D2R, asp, .03, 300, shift);
  const vp = M4.mul(proj, view);
  const prevEye = APP.cam ? APP.cam.eye : eye;
  APP.cam = { view, proj, vp, eye, f: proj[5], dpr: APP.dpr, shift };
  const faceLon = az * R2D - APP.rot.v * R2D;
  const st = APP.st = { E, ctr: ectr, earthScale: esc, rot: APP.rot.v, ts, time: APP.simTime, faceLon, sun: SUN, lowPower: APP.lowPower };
  // simulate
  if (P.air.v > .01) updateAir(dt, st);
  if (P.cur.v > .01) updateCurrents(dt, st);
  if (P.slab.v > .3) updateSlab(dt, st);
  updateDesert(dt, st);
  // emit particles
  R.sn = 0;
  emitSun(st); emitBeams(st); emitRing(st); emitAir(st); emitCurrents(st); emitStorms(st); emitEnsoGlobe(st); emitSlab(st); emitDesert(st);
  // render
  R.scene.bind();
  gl.clearColor(.006, .009, .02, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.CULL_FACE);
  gl.disable(gl.DEPTH_TEST); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  R.star.use().f('uProj', proj).f('uView', view).f('uDpr', APP.dpr).f('uTime', APP.time);
  gl.bindVertexArray(R.stars); gl.drawArrays(gl.POINTS, 0, R.starN);
  gl.disable(gl.BLEND); gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
  const eu = (p) => p.use().f('uProj', proj).f('uView', view).f('uModel', E).f('uSun', SUN).f('uCam', eye);
  eu(R.earth).f('uR', 1).tex('uLand', 0, R.landTex).tex('uDetail', 1, R.detailTex).tex('uCur', 2, R.curTex)
    .f('uTime', APP.simTime).f('uAmbient', P.ambient.v).f('uTemp', P.temp.v).f('uSST', P.sst.v).f('uCurInf', P.curInf.v)
    .f('uEnsoVis', P.ensoVis.v).f('uEnsoK', P.ensoK.v).f('uDesert', P.desert.v).f('uFuture', P.future.v).f('uPressure', P.pressure.v)
    .f('uGrid', P.grid.v).f('uDim', lerp(1, .7, away)).f('uSahel', P.sahel.v).f('uBand', [APP.band[0], APP.band[1], P.bandA.v, 0]);
  gl.bindVertexArray(R.sphere.vao); gl.drawElements(gl.TRIANGLES, R.sphere.count, gl.UNSIGNED_INT, 0);
  if (P.slab.v > .002) {
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    R.slab.use().f('uVP', vp).f('uEarth', E).f('uMorph', P.slab.v).f('uK', P.k.v).f('uTime', APP.simTime).f('uAlpha', smooth(0, .12, P.slab.v))
      .f('uSun', SUN).f('uCam', eye).f('uLine', APP.el.warm);
    gl.bindVertexArray(R.slabVao); gl.drawElements(gl.TRIANGLES, R.slabN, gl.UNSIGNED_INT, 0);
    gl.disable(gl.BLEND);
  }
  if (P.terr.v > .002) {
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    R.terr.use().f('uVP', vp).f('uEarth', E).f('uMorph', P.terr.v).f('uSun', V3.norm([.5, .75, .45])).f('uCam', eye)
      .f('uGrass', DES.grass.v).f('uFarm', DES.farm.v).f('uGraze', DES.graze.v).f('uForest', DES.forest.v).f('uWater', DES.water.v)

  if (pu.vis > .001) { drawProps(R.pTrees, APP.cam, pu); drawProps(R.pHerd, APP.cam, pu); drawProps(R.pHouse, APP.cam, pu); drawProps(R.pRoof, APP.cam, pu); }
  if (pu.slab > .001) drawProps(R.pLand, APP.cam, { ...pu, vis: 0 });
  // clouds + atmosphere
  gl.depthMask(false); gl.enable(gl.BLEND);
  if (P.clouds.v > .01) { gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); eu(R.cloud).f('uR', 1.009).tex('uDetail', 0, R.detailTex).f('uTime', APP.simTime).f('uA', P.clouds.v * (1 - away * .5)).f('uStorm', P.storms.v); gl.bindVertexArray(R.sphere.vao); gl.drawElements(gl.TRIANGLES, R.sphere.count, gl.UNSIGNED_INT, 0); }
  gl.blendFunc(gl.ONE, gl.ONE); eu(R.atmo).f('uR', 1.05).f('uCenter', ectr).f('uA', 1).f('uWarm', P.future.v).f('uRim', .3);
  gl.bindVertexArray(R.sphere.vao); gl.drawElements(gl.TRIANGLES, R.sphere.count, gl.UNSIGNED_INT, 0);
  gl.depthMask(true); gl.disable(gl.BLEND);
  drawStreaks(APP.cam, W, H);
  // motion blur from camera / morph speed
  const eyeSpd = V3.len(V3.sub(eye, prevEye)) / dt / Math.max(1, dist);
  const blur = clamp(eyeSpd * .2 + Math.abs(P.slab.vel) * .1 + Math.abs(P.terr.vel) * .1 + Math.abs(APP.rot.vel - (APP.spin || 0)) * .05, 0, .5) * (APP.lowPower ? .6 : 1);
  postProcess(W, H, blur, .9);
  updateLabels(dt);
  if (APP.panel && APP.panel.tick) APP.panel.tick();
}
function emitEnsoGlobe(st) {
  const v = P.ensoVis.v * (1 - smooth(.05, .3, Math.max(P.slab.v, P.terr.v))); if (v < .02) return;
  const k = P.ensoK.v, lon0 = lerp(135, 205, k);
  for (let i = 0; i < 40; i++) {
    const h = hash2(i, 7), h2 = hash2(i, 13), h3 = hash2(i, 29);
    const la = (h - .5) * 13, lo = lon0 + (h2 - .5) * 32, r = 1.02 + h3 * .015;
    const p = M4.xf(st.E, sph(la, lo, r)); Sv(p, p, [.95, .97, 1], v * .09, .05 + h3 * .05);
    const ph = (st.time * .8 + h3) % 1, q1 = M4.xf(st.E, sph(la, lo, 1.02 - ph * .02)), q2 = M4.xf(st.E, sph(la, lo, 1.026 - ph * .02));
    Sv(q1, q2, COL.rain, v * .5, .0035);
  }
}

/* ---------------- boot ---------------- */
function boot() {
  try { initRenderer(); } catch (e) { fatal('그래픽을 초기화하지 못했습니다.<br><small>' + e.message + '</small>'); return; }
  R.landTex = texFromData(2048, 1024, buildLandTexture(GEO.FALLBACK.map(r => [r])));
  R.curTex = texFromData(1024, 512, buildCurrentTexture());
  buildTerrain(); initAir(); initCurrents(); initSlab(); initDesert();
  resize(); buildProgress();
  APP.i = 0; go(0, true);
  C.dist.v = 6.5; C.dist.t = 3.9;
  requestAnimationFrame(frame);
  const saved = loadSave();
  if (saved > 0) {
    const r = $('#resume');
    r.innerHTML = `<div class="eyebrow" style="font-size:12px;letter-spacing:.26em;color:var(--cyan);font-weight:600">이어서 학습하기</div><h3>SCENE ${String(saved + 1).padStart(2, '0')} · ${SC[saved].name}</h3><p>마지막으로 학습한 위치에서 계속할 수 있어요.</p><div class="btns"><button class="pill hit" id="r-new">처음부터</button><button class="pill primary hit" id="r-go">이어서 보기</button></div>`;
    r.classList.remove('off');
    $('#r-go').onclick = e => { e.stopPropagation(); r.classList.add('off'); go(saved); };
    $('#r-new').onclick = e => { e.stopPropagation(); r.classList.add('off'); };
  }
  loadLiveCoastlines().then(polys => {
    if (polys) { try { updateTex(R.landTex, 2048, 1024, buildLandTexture(polys)); APP.coast = 'live'; } catch (e) { APP.coast = 'fallback'; } }
    else APP.coast = 'fallback';
    updateHUD();
  });
}
if (gl) boot();
